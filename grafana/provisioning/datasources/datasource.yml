# AI Course Platform - Grafana 数据源自动配置
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  # 日志集中化（Loki）：与 Prometheus 并列构成可观测性三角 Logs 支柱；
  # 显式声明 uid=loki，供 dashboard 日志面板按 {"type":"loki","uid":"loki"} 引用。
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    uid: loki
    isDefault: false
    editable: false
