name: 功能建议
description: 提出新功能或改进建议（含功能扩展可行性考量）
title: "[Feature] 简要描述建议"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提出建议！建议将按 `docs/项目手册.md` 第十部分（下一步计划与演进路线）的价值/成本框架评估。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 *
      description: 该功能解决什么痛点？面向哪类用户（学生/教师/管理员）？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望方案 *
      description: 你期望的交互与效果（可附示意图或参考产品）
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 是否考虑过其他实现方式
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 仅前端
        - 仅后端
        - 前后端
        - 涉及 Python 引擎（KG/RAG）
        - 涉及数据库结构
  - type: textarea
    id: extra
    attributes:
      label: 附加信息
      description: 优先级建议、工作量估计、相关 Issue/文档链接
