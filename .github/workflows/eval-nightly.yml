name: Nightly RAG Evaluation

# 评测常态化（研读报告 §10.11#4）：将 evaluation/ 纳入 CI 定时跑，持续监控幻觉率/检索召回。
# 每日凌晨（UTC 18:00 ≈ 北京时间 02:00）触发，亦支持手动 workflow_dispatch。
#
# 设计要点：
# 1) 评测脚手架校验（py_compile + qa-set.json 结构）始终执行，零基础设施依赖，保证最基本护栏；
# 2) 后端以 mysql+redis 服务容器启动（复用 backend CI job 同款约定），跑「仅检索召回」评测；
# 3) 【2026-11-07 P1 整改批】拉起真实 8002 引擎（uvicorn 进程，非容器）：装 CPU 版 torch +
#    rag_service 引擎依赖 → 健康等待 → seed-rag-corpus.py 重放语料 → 注入 RAG_ENABLED=true，
#    evaluate.py 经 backend 代理打到真实混合检索（BM25+向量+RRF），产出真实 recall@k。
#    引擎链路任一步失败时该步 continue-on-error 且不置 RAG_ENABLED → 退回 503 降级语义
#    （evaluate.py 记录 retrieve_error，job 不中断）——nightly 结果 JSON 的 mode 字段可区分两态；
# 4) 结果 JSON 作为 artifact 上传，便于趋势对比与答辩证据留存。

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    name: Nightly RAG Evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # 与 backend CI job 一致的 MySQL/Redis 服务容器约定
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: eval-nightly-pw-7c2k
          MYSQL_DATABASE: ai_course_platform
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -peval-nightly-pw-7c2k"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7.4.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_PW: eval-nightly-pw-7c2k
      JWT_SECRET: eval-nightly-jwt-secret-0123456789abcdef0123456789abcdef
      SPRING_DATASOURCE_PASSWORD: eval-nightly-pw-7c2k
      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: "6379"
      # RAG 引擎对接（2026-11-07 P1 整改批）：RAG_ENABLED 由「引擎步骤」成功后经 GITHUB_ENV 覆盖为 true；
      # 引擎失败则保持 false，退回 503 降级语义（evaluate.py 如实记录 retrieve_error）。
      RAG_ENABLED: "false"
      RAG_BASE_URL: http://localhost:8002
      HF_ENDPOINT: https://hf-mirror.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ---- 步骤一：评测脚手架校验（始终执行，零基础设施）----
      - name: Validate evaluation harness
        run: |
          python -m py_compile evaluation/evaluate.py
          python - <<'PY'
          import json
          with open('evaluation/qa-set.json', encoding='utf-8') as f:
              d = json.load(f)
          assert 'questions' in d and isinstance(d['questions'], list) and len(d['questions']) > 0, "qa-set.json 缺少 questions 列表"
          assert all('keywords' in q and 'question' in q for q in d['questions']), "qa-set 题目缺字段"
          print("评测脚手架 OK：", len(d['questions']), "题")
          PY

      # ---- 步骤二：构建后端（验证仍可打包，不跑单测）----
      - name: Build backend (skip tests)
        working-directory: backend
        run: mvn -B package -DskipTests -Dspotbugs.skip=true -Djacoco.skip=true

      # ---- 步骤三：载入库表（index.sql）----
      - name: Load schema (index.sql)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mysql-client
          mysql -h 127.0.0.1 -u root -p"$DB_PW" ai_course_platform < backend/src/main/resources/index.sql

      # ---- 步骤三点五（2026-11-07 P1 整改批）：拉起真实 RAG 引擎 + 语料重放 ----
      # CPU 版 torch 先装（Linux PyPI 默认是 CUDA 版，>2GB 拖慢 job）；引擎步骤失败不红屏，
      # 由 RAG_ENABLED=false 兜底走降级语义。嵌入模型经 HF_ENDPOINT 镜像下载（~90MB）。
      - name: Start RAG engine (8002) and seed corpus
        continue-on-error: true
        working-directory: python-services/rag_service
        env:
          RAG_ENGINE_READY: "1"
          RAG_DATA_DIR: ${{ runner.temp }}/rag-data
        run: |
          set -e
          pip install --no-cache-dir torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir -r requirements.txt -r requirements-engine.txt
          nohup python -m uvicorn rag_service:app --host 127.0.0.1 --port 8002 > /tmp/rag-engine.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8002/api/v1/rag/health >/dev/null 2>&1; then
              echo "RAG 引擎健康（第 ${i} 次探测）"; break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8002/api/v1/rag/health || { echo "RAG 引擎未就绪，打印日志："; tail -40 /tmp/rag-engine.log; exit 1; }
          cd ../../
          python scripts/seed-rag-corpus.py
          # 引擎 + 语料就绪 → 后续步骤以真引擎跑评测
          echo "RAG_ENABLED=true" >> "$GITHUB_ENV"
          echo "RAG 引擎与语料就绪，评测将以 mode=ENGINE 运行"

      # ---- 步骤四：启动后端 + 等待健康 + 跑检索评测 + 落盘结果 ----
      - name: Start backend, wait health, run retrieval eval
        working-directory: backend
        run: |
          set -e
          nohup mvn -B spring-boot:run > /tmp/backend.log 2>&1 &
          echo "后端启动中…"
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/actuator/health/probe >/dev/null 2>&1; then
              echo "后端健康（第 ${i} 次探测）"; break
            fi
            sleep 3
          done
          # 探 probe 组（readinessState+database+redis+diskSpace），不探综合 /health：
          # CI 不注入 DEEPSEEK_API_KEY，综合状态含 llmProvider → 恒 503，会让本作业永远等不到就绪
          curl -fsS http://localhost:8080/api/actuator/health/probe || { echo "后端未就绪，打印日志："; tail -40 /tmp/backend.log; exit 1; }

          mkdir -p ../evaluation/results
          python ../evaluation/evaluate.py \
            --base http://localhost:8080/api \
            --username admin --password 123456 \
            --course 1 --topk 5 --tag nightly \
            --out ../evaluation/results/nightly.json
          echo "评测完成，结果："
          python -c "import json;d=json.load(open('../evaluation/results/nightly.json',encoding='utf-8'));print(json.dumps(d['summary'],ensure_ascii=False,indent=2))"

      # ---- 步骤五：上传结果产物 ----
      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-eval-nightly
          path: evaluation/results/nightly.json
          retention-days: 30
