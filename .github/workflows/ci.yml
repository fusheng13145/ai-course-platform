name: CI

# 触发条件：主干推送、对主干的 PR、以及手动触发
on:
  push:
    branches: [main, master, leyon]
  pull_request:
    branches: [main, master, leyon]
  workflow_dispatch:

# 最小权限原则：CI 仅需读取仓库内容
permissions:
  contents: read

# 同一分支上的重复运行只保留最新一次，避免资源浪费
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # 前端：代码质量门禁（ESLint + Prettier + 依赖安全审计）
  # 与构建 job 并行，加速 PR 反馈
  # ------------------------------------------------------------------
  frontend-quality:
    name: Frontend Quality (lint + format + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: API 方法引用一致性
        # 校验所有 import 自 @/api/* 的调用在对应模块中有导出，防止重构后遗留失效引用
        run: npm run lint:api-refs

      - name: Type check (vue-tsc) 棘轮门禁
        # 存量类型错误基线见 frontend/scripts/typecheck-baseline.json：
        # 错误数不得超过基线（防回归），且基线只许下调；修复存量后同步收紧。
        run: npm run typecheck:gate

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Unit tests (Vitest) + Coverage gate
        # 覆盖率门禁：阈值见 frontend/vitest.config.ts（渐进收敛基线，只许上调）
        run: npm run test:coverage

      # 仅高危级别漏洞阻断构建，中低危仅作信息提示，避免误伤常规依赖
      - name: Dependency audit
        run: npm audit --audit-level=high

  # ------------------------------------------------------------------
  # 前端：生产构建（验证可打包、无致命编译/导入错误）
  # ------------------------------------------------------------------
  frontend-build:
    name: Frontend Build (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # ------------------------------------------------------------------
  # 后端：编译 + 单元测试 + Testcontainers 集成测试（Java 21，与 backend/Dockerfile 的 temurin-21 对齐）
  # ------------------------------------------------------------------
  backend:
    name: Backend (Maven + JUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # 修复：ApiContractTest（contract-test profile）直连 localhost:3306 MySQL 与 localhost:6379 Redis，
    # CI runner 无基础设施导致上下文加载失败（11 errors）。提供 GitHub Actions service 容器。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-test-password-8f3k
          MYSQL_DATABASE: ai_course_platform_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-test-password-8f3k"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build, unit & integration tests with coverage gate
        # mvn verify -> surefire 运行单元测试，failsafe 在 verify 阶段运行 Testcontainers 集成测试；
        # 同时触发 jacoco: prepare-agent(探针) -> report(生成 target/site/jacoco) -> check(覆盖率门禁)。
        # 若 JaCoCo 行/分支覆盖率低于阈值，check 失败使 verify 失败 -> 本 job 失败。
        # GitHub 托管 runner（ubuntu-latest）自带 Docker 守护进程，Testcontainers 可直接拉起容器。
        # SPRING_DATASOURCE_PASSWORD / MYSQL_ROOT_PASSWORD 与上方 mysql service 的
        # MYSQL_ROOT_PASSWORD 对齐（application-contract-test.yml / application-local.yml
        # 中默认 1234，仅本地开发库使用）。
        # TESTCONTAINERS_RYUK_DISABLED：GitHub Actions 托管 runner 上 Ryuk 资源回收器
        # 偶发权限/检测问题，禁用后由 runner 销毁时统一回收容器（runner 为临时环境）。
        env:
          SPRING_DATASOURCE_PASSWORD: ci-test-password-8f3k
          MYSQL_ROOT_PASSWORD: ci-test-password-8f3k
          TESTCONTAINERS_RYUK_DISABLED: true
        run: mvn -B verify jacoco:report

      - name: Upload JaCoCo coverage report
        # 即便覆盖率门禁不达标（verify 失败），也保留报告供排查趋势
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: |
            backend/target/site/jacoco
            backend/target/jacoco.exec
          retention-days: 14

  # ------------------------------------------------------------------
  # 安全扫描：Trivy 镜像配置/依赖文件扫描（D24 质量门禁补强）
  # 补充 OSV-Scanner 之外的 CVE 覆盖面（TRIVY_DB 由 Action 内置缓存，无需密钥）。
  # 扫描范围：Dockerfile 配置风险 + 后端/前端依赖清单；镜像运行时扫描由
  # release.yml 推送 GHCR 后按 tag 执行（此处 fs 扫描门禁更快反馈）。
  # ------------------------------------------------------------------
  trivy-scan:
    name: Trivy Security Scan (fs)
    runs-on: ubuntu-latest
    # 最小权限：SARIF 结果以 artifact 形式保存（见下方 upload-artifact），
    # 不再调用 upload-sarif，故无需 security-events / actions 写权限。
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy fs scan (diagnostic table output)
        # 仅用于日志诊断：以 table 格式打印命中的 HIGH/CRITICAL 项，不阻断构建，
        # 便于在门禁失败时直接从日志定位具体漏洞（sarif 模式下详情写入文件，日志不可见）。
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          trivyignores: ".trivyignore"
          exit-code: "0"

      - name: Trivy fs scan (repo config + deps)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          # 豁免 3 个 Tomcat CVE（与 backend/osv-scanner.toml 对齐）：修复版 10.1.58 未发布到
          # Maven Central，且仅影响 Tomcat 内置 FORM/DIGEST/security-constraint（本项目用 JWT，不受影响）。
          trivyignores: ".trivyignore"
          # 修复：trivy-action 的 entrypoint.sh 在 format=sarif 且本参数非 true 时会
          # `unset TRIVY_SEVERITY`（日志特征 "Building SARIF report with all severities"），
          # 使 MEDIUM/LOW 漏洞也计入 exit-code 判定而误报失败（HIGH/CRITICAL 已清零仍 exit 1）。
          # 设为 true 恢复 severity 过滤：SARIF 仍记录全部级别供审阅，仅 HIGH/CRITICAL 触发 exit 1。
          limit-severities-for-sarif: true
          exit-code: "1"

      - name: Upload Trivy SARIF (artifact)
        # 此前用 github/codeql-action/upload-sarif@v3 上传到 GitHub Code Scanning，
        # 但当前仓库未启用 Code Scanning 功能（需仓库 Settings → Code security and analysis 手动开启），
        # 报「Code scanning is not enabled」导致 step 失败。改用 actions/upload-artifact 上传 SARIF
        # 文件作为 build artifact（与 OSV-Scanner/JaCoCo 报告一致），保留 SARIF 供下载审阅。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-report
          path: trivy-results.sarif
          retention-days: 14

  # ------------------------------------------------------------------
  # 安全扫描：gitleaks 密钥/凭据泄漏扫描（F-02 密钥治理防回归）
  # 扫描 checkout 分支的完整历史，命中真实密钥即中断构建。
  # 已知非密钥占位（CI 构建/测试口令、示例文件、历史脱敏标记）见根目录 .gitleaks.toml。
  # ------------------------------------------------------------------
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks (fail on detected secrets)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ------------------------------------------------------------------
  # 后端：软件成分分析（SCA）—— OSV-Scanner 已知漏洞门禁
  # 独立 job，避免拖慢单测反馈；命中已知漏洞（OSV.dev / GitHub Advisory）将中断构建。
  # 无需 NVD_API_KEY 等外部密钥；直接解析 pom.xml 及其 Maven 传递依赖。
  # ------------------------------------------------------------------
  backend-security:
    name: Backend Security (OSV-Scanner)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Maven mirror (avoid Maven Central HTTP 429 rate limits)
        # 修复：Maven Central 对高消费流量实施 429 限流（Sonatype 官方说明）。
        # 将 central 仓库重定向到 Google 托管的 Maven Central 镜像，规避限流。
        # 参考: https://central.sonatype.org/faq/429-error/
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings>
            <mirrors>
              <mirror>
                <id>google-maven-central</id>
                <mirrorOf>central</mirrorOf>
                <url>https://maven-central-eu.storage-download.googleapis.com/maven2/</url>
              </mirror>
            </mirrors>
          </settings>
          EOF

      - name: Pre-resolve Maven dependencies (populate local cache via mirror)
        # 预解析依赖并填充 ~/.m2/repository，后续 maven-resolved 策略可直接复用。
        run: mvn -B dependency:resolve -DincludeScope=runtime

      - name: Install OSV-Scanner
        # google/osv-scanner-action 非可独立在 step 中使用的复合 Action，
        # 改由官方 release 二进制直接运行。
        env:
          OSV_SHA256: bc98e15319ed0d515e3f9235287ba53cdc5535d576d24fd573978ecfe9ab92dc
        run: |
          curl -Lo /tmp/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v2.3.8/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  /tmp/osv-scanner" | sha256sum -c -
          chmod +x /tmp/osv-scanner

      - name: Generate CycloneDX SBOM (via Maven mirror)
        # 由 Maven 生成 SBOM（依赖解析走 settings.xml 镜像 + 本地缓存），
        # 使 OSV-Scanner 扫描阶段无需自行联网解析，彻底规避 Maven Central 429 限流。
        run: mvn -B org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom

      - name: OSV-Scanner (fail on known vulnerabilities)
        # 扫描 CycloneDX SBOM 而非 pom.xml，原因有二：
        # 1) OSV-Scanner v2.3.8 不支持 --strategy flag（会报 "flag provided but not defined"，exit 127）；
        # 2) 默认 pomxml 策略会自行向 repo.maven.apache.org 拉取父 POM，触发 429 限流。
        # 改为扫描 SBOM 后，依赖关系已由 Maven 解析完毕，扫描阶段不做任何外部依赖解析。
        # --config=osv-scanner.toml：豁免 3 个 Tomcat CVE（GHSA-9xv2-5v5q-p794 / GHSA-h3x4-894j-xpx5 /
        # GHSA-gcx9-497g-6cp6），其修复版 10.1.58 未发布到 Maven Central，且仅影响 Tomcat 内置
        # FORM/DIGEST/security-constraint 认证授权机制（本项目用 Spring Security+JWT，不受影响）。
        run: /tmp/osv-scanner scan --format=sarif --output=osv-scan.sarif --sbom=target/bom.json --config=osv-scanner.toml

      - name: Upload OSV-Scanner report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osv-scanner-report
          path: backend/osv-scan.sarif
          retention-days: 14

  # ------------------------------------------------------------------
  # Docker：镜像构建校验（仅主干推送 / 手动触发，避免每个 PR 都做长耗时构建）
  # 验证 backend/Dockerfile 与 frontend/Dockerfile 在干净环境中可成功构建
  # ------------------------------------------------------------------
  docker:
    name: Docker Images Build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images (no push)
        # 修复：docker-compose.yml 的 mysql/redis/backend 服务通过 ${VAR:?...} 强制要求
        # MYSQL_ROOT_PASSWORD / REDIS_PASSWORD / JWT_SECRET，CI 未注入即 interpolate 失败。
        # CI 仅构建镜像（不启动容器），使用 secrets 值（未配置时退化为 CI-only 构建值，不落盘）。
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD || 'ci-build-only-password-9f2k1m8x' }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD || 'ci-build-only-redis-7q4w2e9r' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-build-only-jwt-secret-0123456789abcdef0123456789abcdef' }}
        run: docker compose -f docker-compose.yml build

  # ------------------------------------------------------------------
  # Python 知识图谱基线服务（端口 8001）契约校验
  # 覆盖 docs/项目手册.md 第八部分关键端点，与 Java 端
  # KnowledgeGraphServiceImpl 的下游调用对齐。用 FastAPI TestClient
  # 内嵌运行，不依赖外部端口，稳定且快速。
  # ------------------------------------------------------------------
  python-kg-contract:
    name: Python KG Service Contract (8001)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-services/kg_service
    # 缺陷修复（2026-10-04）：此前无 Neo4j 服务容器，`test_kg_contract.py` 中唯一
    # 直连真实图引擎的用例（_neo4j_store_or_skip）在 CI 恒 skip —— Neo4j 后端
    # 从未真正进过 PR 门禁，只有 fake driver 覆盖。requirements.txt 已装 neo4j 驱动，
    # 故此处起容器让其执行。容器是 CI 全新空库，且该用例只写 course_id=999 / :Kp
    # 并自行清理，不会与共享/本地图库数据冲突。
    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/ci-test-neo4j-8f3k
          NEO4J_dbms_memory_heap_max__size: 1G
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd="cypher-shell -u neo4j -p ci-test-neo4j-8f3k 'RETURN 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python-services/kg_service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Contract + unit tests (FastAPI TestClient)
        # 缺陷修复（2026-10-04）：原先只跑单文件契约测试（旧名 contract_test.py，
        # 现 test_kg_contract.py），`test_kg_store.py`（图存储双实现：内存基线 / Neo4j）
        # 里的 20+ 用例从未进过 PR 门禁。
        # 整目录跑：契约用例仍由 autouse fixture 强制内存后端（确定、不碰图库），
        # 真实引擎用例读取以下环境变量连到服务容器。
        env:
          NEO4J_URI: bolt://127.0.0.1:7687
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: ci-test-neo4j-8f3k
        run: pytest -q

  # ------------------------------------------------------------------
  # Python RAG 检索服务（端口 8002）契约校验
  # 覆盖 docs/项目手册.md 第八部分关键端点，与 Java 端
  # RAGServiceImpl 的下游调用对齐。rag_service.py 为集成契约占位骨架，
  # 真实检索引擎（BM25/向量/embedding/融合）由团队另一成员实现。
  # ------------------------------------------------------------------
  python-rag-contract:
    name: Python RAG Service Contract (8002)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-services/rag_service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python-services/rag_service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Contract + engine unit tests (FastAPI TestClient)
        # 缺陷修复（2026-10-04）：原先只跑单文件契约测试（旧名 contract_test.py，
        # 现 test_rag_contract.py），`test_rag_engine.py`
        # （BM25+向量+RRF 混合检索、分块、索引生命周期、损坏恢复等 29 例）从未进过 PR 门禁。
        # 引擎重依赖（numpy/jieba/rank_bm25/faiss/sentence-transformers）在 CI 不安装，
        # rag_engine 与用例都做了软依赖处理：缺依赖的用例按 skipif 自动跳过，纯算法用例照常跑。
        # 需要真实引擎全绿时另行安装 requirements-engine.txt（见 eval-nightly.yml）。
        run: pytest -q

  # ------------------------------------------------------------------
  # 前端 E2E（Playwright）全栈冒烟测试  [P3 #5]
  # 决策：采用「全栈」方案——后端 jar 连 MySQL/Redis service 容器，前端构建后以
  # vite preview 提供静态资源（playwright.config.ts 经 PW_WEB_SERVER_COMMAND 覆盖 dev），
  # Playwright 跑真实 /api 链路。specs 直连真实 API（未做 page.route 桩），需后端+DB 在线。
  # 当前以 workflow_dispatch 手动触发，待补齐测试种子账号并确认 green 后再纳入 push/PR 默认门禁，
  # 避免在未就绪时污染受保护分支的自动 CI。本沙箱无 Actions runner / Playwright 浏览器，未实跑验证。
  # ------------------------------------------------------------------
  frontend-e2e:
    name: Frontend E2E (Playwright, full-stack)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: frontend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-test-password-8f3k
          MYSQL_DATABASE: ai_course_platform_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-test-password-8f3k"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configure Maven mirror (avoid Maven Central HTTP 429)
        working-directory: backend
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings>
            <mirrors>
              <mirror>
                <id>google-maven-central</id>
                <mirrorOf>central</mirrorOf>
                <url>https://maven-central-eu.storage-download.googleapis.com/maven2/</url>
              </mirror>
            </mirrors>
          </settings>
          EOF

      - name: Build backend jar (skip tests)
        working-directory: backend
        env:
          SPRING_DATASOURCE_PASSWORD: ci-test-password-8f3k
          MYSQL_ROOT_PASSWORD: ci-test-password-8f3k
        run: mvn -B package -DskipTests

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start backend (background) + run Playwright
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/ai_course_platform_test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_PASSWORD: ci-test-password-8f3k
          JWT_SECRET: ci-e2e-jwt-secret-0123456789abcdef0123456789abcdef
          COOKIE_SECURE: "false"
          REQUIRE_HTTPS: "false"
          CSRF_ENABLED: "false"
          PW_WEB_SERVER_COMMAND: "npm run preview -- --port 5173 --strictPort"
        run: |
          java -jar ../backend/target/backend-0.0.1-SNAPSHOT.jar --server.port=8080 > ../backend-e2e.log 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/actuator/health || true)
            if [ -n "$code" ]; then echo "backend health http=$code"; break; fi
            sleep 5
          done
          npx playwright test
          status=$?
          echo "---- backend-e2e.log (tail) ----"; tail -n 50 ../backend-e2e.log || true
          exit $status

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 14

