name: CI

# 触发条件：主干推送、对主干的 PR、以及手动触发
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# 最小权限原则：CI 仅需读取仓库内容
permissions:
  contents: read

# 同一分支上的重复运行只保留最新一次，避免资源浪费
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # 前端：代码质量门禁（ESLint + Prettier + 依赖安全审计）
  # 与构建 job 并行，加速 PR 反馈
  # ------------------------------------------------------------------
  frontend-quality:
    name: Frontend Quality (lint + format + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Unit tests (Vitest) + Coverage gate
        # 覆盖率门禁：阈值见 frontend/vitest.config.ts（渐进收敛基线，只许上调）
        run: npm run test:coverage

      # 仅高危级别漏洞阻断构建，中低危仅作信息提示，避免误伤常规依赖
      - name: Dependency audit
        run: npm audit --audit-level=high

  # ------------------------------------------------------------------
  # 前端：生产构建（验证可打包、无致命编译/导入错误）
  # ------------------------------------------------------------------
  frontend-build:
    name: Frontend Build (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # ------------------------------------------------------------------
  # 后端：编译 + 单元测试 + Testcontainers 集成测试（Java 21，与 backend/Dockerfile 的 temurin-21 对齐）
  # ------------------------------------------------------------------
  backend:
    name: Backend (Maven + JUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # 修复：ApiContractTest（contract-test profile）直连 localhost:3306 MySQL 与 localhost:6379 Redis，
    # CI runner 无基础设施导致上下文加载失败（11 errors）。提供 GitHub Actions service 容器。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-test-password-8f3k
          MYSQL_DATABASE: ai_course_platform_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-test-password-8f3k"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, unit & integration tests with coverage gate
        # mvn verify -> surefire 运行单元测试，failsafe 在 verify 阶段运行 Testcontainers 集成测试；
        # 同时触发 jacoco: prepare-agent(探针) -> report(生成 target/site/jacoco) -> check(覆盖率门禁)。
        # 若 JaCoCo 行/分支覆盖率低于阈值，check 失败使 verify 失败 -> 本 job 失败。
        # GitHub 托管 runner（ubuntu-latest）自带 Docker 守护进程，Testcontainers 可直接拉起容器。
        # SPRING_DATASOURCE_PASSWORD / MYSQL_ROOT_PASSWORD 与上方 mysql service 的
        # MYSQL_ROOT_PASSWORD 对齐（application-contract-test.yml / application-local.yml
        # 中默认 1234，仅本地开发库使用）。
        # TESTCONTAINERS_RYUK_DISABLED：GitHub Actions 托管 runner 上 Ryuk 资源回收器
        # 偶发权限/检测问题，禁用后由 runner 销毁时统一回收容器（runner 为临时环境）。
        env:
          SPRING_DATASOURCE_PASSWORD: ci-test-password-8f3k
          MYSQL_ROOT_PASSWORD: ci-test-password-8f3k
          TESTCONTAINERS_RYUK_DISABLED: true
        run: mvn -B verify jacoco:report

      - name: Upload JaCoCo coverage report
        # 即便覆盖率门禁不达标（verify 失败），也保留报告供排查趋势
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: |
            backend/target/site/jacoco
            backend/target/jacoco.exec
          retention-days: 14

  # ------------------------------------------------------------------
  # 安全扫描：Trivy 镜像配置/依赖文件扫描（D24 质量门禁补强）
  # 补充 OSV-Scanner 之外的 CVE 覆盖面（TRIVY_DB 由 Action 内置缓存，无需密钥）。
  # 扫描范围：Dockerfile 配置风险 + 后端/前端依赖清单；镜像运行时扫描由
  # release.yml 推送 GHCR 后按 tag 执行（此处 fs 扫描门禁更快反馈）。
  # ------------------------------------------------------------------
  trivy-scan:
    name: Trivy Security Scan (fs)
    runs-on: ubuntu-latest
    permissions:
      security-events: write # 上传 SARIF 到 code scanning
      contents: read
      # 修复：github/codeql-action/upload-sarif 需读取 workflow run 元数据，
      # 缺失时报 "Resource not accessible by integration ...
      # /rest/actions/workflow-runs#get-a-workflow-run" 并导致上传失败。
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy fs scan (diagnostic table output)
        # 仅用于日志诊断：以 table 格式打印命中的 HIGH/CRITICAL 项，不阻断构建，
        # 便于在门禁失败时直接从日志定位具体漏洞（sarif 模式下详情写入文件，日志不可见）。
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          trivyignores: '.trivyignore'
          exit-code: '0'

      - name: Trivy fs scan (repo config + deps)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          # 豁免 3 个 Tomcat CVE（与 backend/osv-scanner.toml 对齐）：修复版 10.1.58 未发布到
          # Maven Central，且仅影响 Tomcat 内置 FORM/DIGEST/security-constraint（本项目用 JWT，不受影响）。
          trivyignores: '.trivyignore'
          exit-code: '1'

      - name: Upload Trivy SARIF (artifact)
        # 此前用 github/codeql-action/upload-sarif@v3 上传到 GitHub Code Scanning，
        # 但当前仓库未启用 Code Scanning 功能（需仓库 Settings → Code security and analysis 手动开启），
        # 报「Code scanning is not enabled」导致 step 失败。改用 actions/upload-artifact 上传 SARIF
        # 文件作为 build artifact（与 OSV-Scanner/JaCoCo 报告一致），保留 SARIF 供下载审阅。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-report
          path: trivy-results.sarif
          retention-days: 14

  # ------------------------------------------------------------------
  # 后端：软件成分分析（SCA）—— OSV-Scanner 已知漏洞门禁
  # 独立 job，避免拖慢单测反馈；命中已知漏洞（OSV.dev / GitHub Advisory）将中断构建。
  # 无需 NVD_API_KEY 等外部密钥；直接解析 pom.xml 及其 Maven 传递依赖。
  # ------------------------------------------------------------------
  backend-security:
    name: Backend Security (OSV-Scanner)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Maven mirror (avoid Maven Central HTTP 429 rate limits)
        # 修复：Maven Central 对高消费流量实施 429 限流（Sonatype 官方说明）。
        # 将 central 仓库重定向到 Google 托管的 Maven Central 镜像，规避限流。
        # 参考: https://central.sonatype.org/faq/429-error/
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings>
            <mirrors>
              <mirror>
                <id>google-maven-central</id>
                <mirrorOf>central</mirrorOf>
                <url>https://maven-central-eu.storage-download.googleapis.com/maven2/</url>
              </mirror>
            </mirrors>
          </settings>
          EOF

      - name: Pre-resolve Maven dependencies (populate local cache via mirror)
        # 预解析依赖并填充 ~/.m2/repository，后续 maven-resolved 策略可直接复用。
        run: mvn -B dependency:resolve -DincludeScope=runtime

      - name: Install OSV-Scanner
        # google/osv-scanner-action 非可独立在 step 中使用的复合 Action，
        # 改由官方 release 二进制直接运行。
        env:
          OSV_SHA256: bc98e15319ed0d515e3f9235287ba53cdc5535d576d24fd573978ecfe9ab92dc
        run: |
          curl -Lo /tmp/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v2.3.8/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  /tmp/osv-scanner" | sha256sum -c -
          chmod +x /tmp/osv-scanner

      - name: Generate CycloneDX SBOM (via Maven mirror)
        # 由 Maven 生成 SBOM（依赖解析走 settings.xml 镜像 + 本地缓存），
        # 使 OSV-Scanner 扫描阶段无需自行联网解析，彻底规避 Maven Central 429 限流。
        run: mvn -B org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom

      - name: OSV-Scanner (fail on known vulnerabilities)
        # 扫描 CycloneDX SBOM 而非 pom.xml，原因有二：
        # 1) OSV-Scanner v2.3.8 不支持 --strategy flag（会报 "flag provided but not defined"，exit 127）；
        # 2) 默认 pomxml 策略会自行向 repo.maven.apache.org 拉取父 POM，触发 429 限流。
        # 改为扫描 SBOM 后，依赖关系已由 Maven 解析完毕，扫描阶段不做任何外部依赖解析。
        # --config=osv-scanner.toml：豁免 3 个 Tomcat CVE（GHSA-9xv2-5v5q-p794 / GHSA-h3x4-894j-xpx5 /
        # GHSA-gcx9-497g-6cp6），其修复版 10.1.58 未发布到 Maven Central，且仅影响 Tomcat 内置
        # FORM/DIGEST/security-constraint 认证授权机制（本项目用 Spring Security+JWT，不受影响）。
        run: /tmp/osv-scanner scan --format=sarif --output=osv-scan.sarif --sbom=target/bom.json --config=osv-scanner.toml

      - name: Upload OSV-Scanner report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osv-scanner-report
          path: backend/osv-scan.sarif
          retention-days: 14

  # ------------------------------------------------------------------
  # Docker：镜像构建校验（仅主干推送 / 手动触发，避免每个 PR 都做长耗时构建）
  # 验证 backend/Dockerfile 与 frontend/Dockerfile 在干净环境中可成功构建
  # ------------------------------------------------------------------
  docker:
    name: Docker Images Build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images (no push)
        # 修复：docker-compose.yml 的 mysql/redis/backend 服务通过 ${VAR:?...} 强制要求
        # MYSQL_ROOT_PASSWORD / REDIS_PASSWORD / JWT_SECRET，CI 未注入即 interpolate 失败。
        # CI 仅构建镜像（不启动容器），使用 secrets 值（未配置时退化为 CI-only 构建值，不落盘）。
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD || 'ci-build-only-password-9f2k1m8x' }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD || 'ci-build-only-redis-7q4w2e9r' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-build-only-jwt-secret-0123456789abcdef0123456789abcdef' }}
        run: docker compose -f docker-compose.yml build

  # ------------------------------------------------------------------
  # Python 知识图谱基线服务（端口 8001）契约校验
  # 覆盖 docs/项目手册.md 第八部分关键端点，与 Java 端
  # KnowledgeGraphServiceImpl 的下游调用对齐。用 FastAPI TestClient
  # 内嵌运行，不依赖外部端口，稳定且快速。
  # ------------------------------------------------------------------
  python-kg-contract:
    name: Python KG Service Contract (8001)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-services/kg_service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python-services/kg_service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Contract smoke test (FastAPI TestClient)
        run: pytest -q contract_test.py

  # ------------------------------------------------------------------
  # Python RAG 检索服务（端口 8002）契约校验
  # 覆盖 docs/项目手册.md 第八部分关键端点，与 Java 端
  # RAGServiceImpl 的下游调用对齐。rag_service.py 为集成契约占位骨架，
  # 真实检索引擎（BM25/向量/embedding/融合）由团队另一成员实现。
  # ------------------------------------------------------------------
  python-rag-contract:
    name: Python RAG Service Contract (8002)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-services/rag_service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python-services/rag_service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Contract smoke test (FastAPI TestClient)
        run: pytest -q contract_test.py
