name: CI

# 触发条件：主干推送、对主干的 PR、以及手动触发
on:
  push:
    branches: [main, master, leyon]
    # 纯文档/归档改动不占用 runner：这类提交不可能影响编译、测试、镜像内容或密钥面。
    # ⚠️ 只对 push 生效；pull_request 故意**不设**路径过滤 → 任何进 main 的 PR 一定跑满全部门禁，
    #    收敛的是「日常在 leyon 上推文档也排队等 CI」，不收敛任何进入主干的把关强度。
    paths-ignore:
      - "docs/**"
      - "archive/**"
      - "*.md"
      - "**/*.md"
      - ".gitignore"
  pull_request:
    branches: [main, master, leyon]
  workflow_dispatch:

# 最小权限原则：CI 仅需读取仓库内容
permissions:
  contents: read

# 同一分支上的重复运行只保留最新一次，避免资源浪费
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # 前端：代码质量门禁（ESLint + Prettier + 依赖安全审计）
  # 与构建 job 并行，加速 PR 反馈
  # ------------------------------------------------------------------
  frontend-quality:
    name: Frontend Quality (lint + format + audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: API 方法引用一致性
        # 校验所有 import 自 @/api/* 的调用在对应模块中有导出，防止重构后遗留失效引用
        run: npm run lint:api-refs

      - name: Type check (vue-tsc) 棘轮门禁
        # 存量类型错误基线见 frontend/scripts/typecheck-baseline.json：
        # 错误数不得超过基线（防回归），且基线只许下调；修复存量后同步收紧。
        run: npm run typecheck:gate

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Format check (Prettier, e2e)
        # R-21：e2e 的 29 个文件此前零格式覆盖——format:check 的 glob 只写 src/**。
        # 本步只负责 e2e；src 的存量格式债不在本批范围，仍由上面那一步承担。
        run: npm run format:check:e2e

      - name: Unit tests (Vitest) + Coverage gate
        # 覆盖率门禁：阈值见 frontend/vitest.config.ts（渐进收敛基线，只许上调）
        run: npm run test:coverage

      # 仅高危级别漏洞阻断构建，中低危仅作信息提示，避免误伤常规依赖
      - name: Dependency audit
        run: npm audit --audit-level=high

  # ------------------------------------------------------------------
  # 前端：生产构建（验证可打包、无致命编译/导入错误）
  # ------------------------------------------------------------------
  frontend-build:
    name: Frontend Build (Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # 产物体积预算门禁（2026-10-13 经项目主批准接入 CI）：
      # 把 manualChunks 清理后的实测分块写成上限（echarts/element-plus/xlsx/其余合计/JS 合计/CSS），
      # 任一超限即失败，防止"顺手多引一个组件库"静默推高首屏体积。
      # 依赖上一步 build 产出的 dist/assets —— 顺序不可调换。
      - name: Bundle size gate
        run: npm run size:gate

  # ------------------------------------------------------------------
  # 后端：编译 + 单元测试 + Testcontainers 集成测试（Java 21，与 backend/Dockerfile 的 temurin-21 对齐）
  # ------------------------------------------------------------------
  backend:
    name: Backend (Maven + JUnit)
    runs-on: ubuntu-latest
    # 上限取本机全量实跑的约 4 倍余量（clean verify 含 12 例 IT 实测 03:40），
    # 目的是把「网络挂起 / Docker 起不来」这类无进展的作业在 30 分钟内判定失败，
    # 而不是让它在 6 小时后被 Actions 强杀成一条看不出原因的红灯。
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    # 修复：ApiContractTest（contract-test profile）直连 localhost:3306 MySQL 与 localhost:6379 Redis，
    # CI runner 无基础设施导致上下文加载失败（11 errors）。提供 GitHub Actions service 容器。
    # 版本与 docker-compose.yml 的第三方镜像 pin 逐字一致（mysql:8.4.11 / redis:7.4.11-alpine）：
    # 测试环境＝编排环境＝生产，且 Testcontainers 与 service 容器共用同一份镜像，不产生旁支版本。
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: ci-test-password-8f3k
          MYSQL_DATABASE: ai_course_platform_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-test-password-8f3k"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7.4.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Configure Maven mirror (avoid Maven Central HTTP 429 rate limits)
        # 与 backend-security / frontend-e2e 两个 job 同款（那两处 2026-09 已因 Central 对高消费流量
        # 429 限流而加过镜像）：本 job 此前是唯一没配镜像的后端作业，缓存未命中时
        # 依赖解析直连 repo.maven.apache.org → 随机 429 → 整条流水线无理由变红。
        # 参考: https://central.sonatype.org/faq/429-error/
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings>
            <mirrors>
              <mirror>
                <id>google-maven-central</id>
                <mirrorOf>central</mirrorOf>
                <url>https://maven-central-eu.storage-download.googleapis.com/maven2/</url>
              </mirror>
            </mirrors>
          </settings>
          EOF

      - name: Build, unit & integration tests with coverage gate
        # mvn verify -> surefire 运行单元测试，failsafe 在 verify 阶段运行 Testcontainers 集成测试；
        # 同时触发 jacoco: prepare-agent(探针) -> report(生成 target/site/jacoco) -> check(覆盖率门禁)。
        # 若 JaCoCo 行/分支覆盖率低于阈值，check 失败使 verify 失败 -> 本 job 失败。
        # GitHub 托管 runner（ubuntu-latest）自带 Docker 守护进程，Testcontainers 可直接拉起容器。
        # SPRING_DATASOURCE_PASSWORD / MYSQL_ROOT_PASSWORD 与上方 mysql service 的
        # MYSQL_ROOT_PASSWORD 对齐（application-contract-test.yml / application-local.yml
        # 中默认 1234，仅本地开发库使用）。
        # TESTCONTAINERS_RYUK_DISABLED：GitHub Actions 托管 runner 上 Ryuk 资源回收器
        # 偶发权限/检测问题，禁用后由 runner 销毁时统一回收容器（runner 为临时环境）。
        env:
          SPRING_DATASOURCE_PASSWORD: ci-test-password-8f3k
          MYSQL_ROOT_PASSWORD: ci-test-password-8f3k
          TESTCONTAINERS_RYUK_DISABLED: true
        run: mvn -B verify jacoco:report

      - name: Upload JaCoCo coverage report
        # 即便覆盖率门禁不达标（verify 失败），也保留报告供排查趋势
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: |
            backend/target/site/jacoco
            backend/target/jacoco.exec
          retention-days: 14

  # ------------------------------------------------------------------
  # 安全扫描：Trivy 镜像配置/依赖文件扫描（D24 质量门禁补强）
  # 补充 OSV-Scanner 之外的 CVE 覆盖面（TRIVY_DB 由 Action 内置缓存，无需密钥）。
  # 扫描范围：Dockerfile 配置风险 + 后端/前端依赖清单；镜像运行时扫描由
  # release.yml 推送 GHCR 后按 tag 执行（此处 fs 扫描门禁更快反馈）。
  # ------------------------------------------------------------------
  trivy-scan:
    name: Trivy Security Scan (fs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 最小权限：SARIF 结果以 artifact 形式保存（见下方 upload-artifact），
    # 不再调用 upload-sarif，故无需 security-events / actions 写权限。
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 缺陷修复（2026-10-07，CI 红灯根因 C）：trivy 解析 backend/pom.xml 时会自行向
      # repo.maven.apache.org 取父 POM / BOM，被 Maven Central 429 限流时直接
      # `FATAL ... returned 429 Too Many Requests`（本机已实测复现，命中
      # spring-pulsar-bom:1.2.18），**这不是漏洞命中，而是扫描器自身报错 → exit 1 点红**。
      # 与 backend-security job 同一套解法：先把 central 指向 Google 托管镜像、
      # 预解析依赖填充 ~/.m2，trivy 随后优先读本地缓存，扫描阶段不再联网解析。
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Populate local Maven cache (via mirror) before Trivy resolves POMs
        working-directory: backend
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings>
            <mirrors>
              <mirror>
                <id>google-maven-central</id>
                <mirrorOf>central</mirrorOf>
                <url>https://maven-central-eu.storage-download.googleapis.com/maven2/</url>
              </mirror>
            </mirrors>
          </settings>
          EOF
          mvn -B -q dependency:resolve -DincludeScope=runtime

      - name: Trivy fs scan (vuln diagnostic table output)
        # 仅用于日志诊断：以 table 格式打印命中的 HIGH/CRITICAL 项，不阻断构建，
        # 便于在门禁失败时直接从日志定位具体漏洞（sarif 模式下详情写入文件，日志不可见）。
        # scanners 显式限定为 vuln：① 密钥面由下方 secret-scan（gitleaks）job 统一负责，
        # 那里有按值登记的 .gitleaks.toml 白名单，trivy 自带的通用密钥规则会把 CI 占位口令
        # 与 .env.example 的刻意不合规样例一并点红，属重复且不可解释的噪声；
        # ② misconfig 自 2026-10-08 起拆到独立的门禁步骤（豁免文件不同，混扫会让本表与判定口径不一致）。
        # version 显式钉住（2026-10-07）：trivy-action v0.35.0 的默认版本是隐式的（其 action.yaml 里
        # `version` 默认 v0.69.3），一旦 bump action 就会静默换扫描器版本、判定结果随之漂移；
        # 这里钉成与本机复验一致的版本，使「本机跑 ≡ CI 跑」成立（豁免口径取证见 .trivyignore 头部）。
        # ⚠ 必须带 `v` 前缀：setup-trivy 走 trivy 的 contrib/install.sh，它拿这个串去查
        #   releases/tags/<tag>，实测 `0.69.3` → 404（安装步骤直接失败、作业红在装 trivy 上），
        #   `v0.69.3` → 200。
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln"
          format: "table"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          trivyignores: ".trivyignore"
          version: "v0.69.3"
          exit-code: "0"

      - name: Trivy fs scan (vuln gate + SARIF)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          # 豁免口径（2026-10-07 按 OSV 实查重定，与 backend/osv-scanner.toml 逐字同步）：
          #   · 原 3 条 Tomcat CRITICAL 豁免**已删除**——`tomcat.version` 升到 10.1.60 后复查为 0 命中；
          #   · 仅保留 spring-webmvc CVE-2026-47884：6.2.x 线无修复版（唯一修复在 7.0.9，需 Boot 4），
          #     且 XsltView 视图渲染路径经三项取证不可达。能升级的绝不豁免，勿在此追加新条目。
          # 注意此前该 job 一直死在 Maven 429 FATAL（根因 C），misconfig 判定从未真正跑到底，
          # 所以 DS-0002 是修好 C 之后才暴露出来的下一颗雷；429 解法见上方 dependency:resolve 步骤。
          # ⚠ 本步不再挂 misconfig 豁免：plain `.trivyignore` 对 misconfig 是全局按 ID 放行，
          #   会把在用镜像的 root 缺陷一并盖掉。misconfig 走下一步的按路径豁免。
          trivyignores: ".trivyignore"
          # 修复：trivy-action 的 entrypoint.sh 在 format=sarif 且本参数非 true 时会
          # `unset TRIVY_SEVERITY`（日志特征 "Building SARIF report with all severities"），
          # 使 MEDIUM/LOW 漏洞也计入 exit-code 判定而误报失败（HIGH/CRITICAL 已清零仍 exit 1）。
          # 设为 true 恢复 severity 过滤：SARIF 仍记录全部级别供审阅，仅 HIGH/CRITICAL 触发 exit 1。
          limit-severities-for-sarif: true
          version: "v0.69.3"
          exit-code: "1"

      # ------------------------------------------------------------------
      # misconfig 门禁（DR-34 真修后新增，2026-10-08）
      # 与 vuln 门禁分开跑的原因：plain `.trivyignore` 对 misconfig 只能**按规则 ID 全局**
      # 放行，无法限定路径；一旦为归档件保留 DS-0002，在用镜像的 root 缺陷也会被一起盖掉。
      # `.trivyignore.yaml` 的 misconfigurations[].paths 支持按路径生效（本机三组对照实测：
      # paths=archive/** 时 backend/frontend 仍点红、paths 指向不存在目录时一条都没被盖），
      # 取证见手册 §24.2.3 根因 F。DS-0002 本体已在 backend/ 与 frontend/ 两个 Dockerfile
      # 真修（非 root USER），残留豁免只指向 archive/**，不接受新增在用镜像的豁免。
      # 用 table 而非 sarif：命中时日志直接可读，misconfig 项无需进 Code Scanning。
      # ------------------------------------------------------------------
      - name: Trivy misconfig gate
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "misconfig"
          format: "table"
          severity: "HIGH,CRITICAL"
          trivyignores: ".trivyignore.yaml"
          version: "v0.69.3"
          exit-code: "1"

      - name: Upload Trivy SARIF (artifact)
        # 此前用 github/codeql-action/upload-sarif@v3 上传到 GitHub Code Scanning，
        # 但当前仓库未启用 Code Scanning 功能（需仓库 Settings → Code security and analysis 手动开启），
        # 报「Code scanning is not enabled」导致 step 失败。改用 actions/upload-artifact 上传 SARIF
        # 文件作为 build artifact（与 OSV-Scanner/JaCoCo 报告一致），保留 SARIF 供下载审阅。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-report
          path: trivy-results.sarif
          retention-days: 14

  # ------------------------------------------------------------------
  # 安全扫描：gitleaks 密钥/凭据泄漏扫描（F-02 密钥治理防回归）
  #
  # 【2026-10-07 口径重构】原实现 = gitleaks-action + `fetch-depth: 0` 的**全历史扫描**，
  # 本机实测（`ghcr.io/gitleaks/gitleaks:v8.30.1 detect --source=. --config=.gitleaks.toml`，
  # 125 个提交）命中 10 条，逐条核对后**没有一条是当前内容里的真实密钥**：
  #   · 5 条是 `.github/workflows/*` 里 CI 服务容器的占位口令（已在 .gitleaks.toml 按值登记）；
  #   · 5 条只在历史提交里（F-02 轮换与 filter-repo 擦除的遗留，当前文件内容已无，
  #     `git show <commit>:<file>` 与 HEAD 逐条比对确认）。
  # 后果：任何 leyon→main 的 PR 都要重扫 main 之外的全部提交，已失效的历史口令反复点红，
  # 把真正该拦住的「交付内容含密钥」淹没在噪声里（这就是 CI 大面积不达标的根因之一）。
  #
  # 现拆成两段职责清晰的门禁：
  #   ① HEAD 内容扫描——真实密钥绝不允许出现在被交付的文件里，与它是哪次提交写入的无关；
  #   ② 变更区间扫描——本次 push / 本 PR 新增的提交，用于「刚引入密钥」的早反馈。
  # 两段都不放宽规则本身（仍用同一份 .gitleaks.toml，且该文件坚持**按值**豁免、不按路径豁免）。
  # 另：不再走 gitleaks-action（其对区间不可判定时的回退行为不可控，且依赖市场 Action 计费），
  # 改为直接跑钉好版本的官方镜像；本机已存在同一 digest，故本地复验无需联网拉取。
  # ------------------------------------------------------------------
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # 补丁级钉版（禁 latest）。升级时同步改这一处即可。
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          # ② 需要 base..head 的完整对象库才能解析区间；① 不依赖历史。
          fetch-depth: 0

      - name: ① HEAD 内容扫描（主门禁）
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            "$GITLEAKS_IMAGE" detect --no-git \
              --source=/repo \
              --config=/repo/.gitleaks.toml \
              --redact --no-banner --exit-code 1

      - name: ② 变更提交区间扫描（增量反馈）
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            BEFORE="${{ github.event.before }}"
            case "$BEFORE" in
              ""|*[!0-9a-f]*) RANGE="-1 HEAD" ;;          # 取不到基线：只扫本次提交
              0000000000000000000000000000000000000000) RANGE="-1 HEAD" ;;  # 新建分支首次推送
              *) RANGE="$BEFORE..${{ github.sha }}" ;;
            esac
          fi
          echo "gitleaks 扫描区间：$RANGE"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            "$GITLEAKS_IMAGE" detect \
              --source=/repo \
              --config=/repo/.gitleaks.toml \
              --log-opts="$RANGE" \
              --redact --no-banner --exit-code 1

  # ------------------------------------------------------------------
  # 后端：软件成分分析（SCA）—— OSV-Scanner 已知漏洞门禁
  # 独立 job，避免拖慢单测反馈；命中已知漏洞（OSV.dev / GitHub Advisory）将中断构建。
  # 无需 NVD_API_KEY 等外部密钥；直接解析 pom.xml 及其 Maven 传递依赖。
  # ------------------------------------------------------------------
  backend-security:
    name: Backend Security (OSV-Scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Maven mirror (avoid Maven Central HTTP 429 rate limits)
        # 修复：Maven Central 对高消费流量实施 429 限流（Sonatype 官方说明）。
        # 将 central 仓库重定向到 Google 托管的 Maven Central 镜像，规避限流。
        # 参考: https://central.sonatype.org/faq/429-error/
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings>
            <mirrors>
              <mirror>
                <id>google-maven-central</id>
                <mirrorOf>central</mirrorOf>
                <url>https://maven-central-eu.storage-download.googleapis.com/maven2/</url>
              </mirror>
            </mirrors>
          </settings>
          EOF

      - name: Pre-resolve Maven dependencies (populate local cache via mirror)
        # 预解析依赖并填充 ~/.m2/repository，后续 maven-resolved 策略可直接复用。
        run: mvn -B dependency:resolve -DincludeScope=runtime

      - name: Install OSV-Scanner
        # google/osv-scanner-action 非可独立在 step 中使用的复合 Action，
        # 改由官方 release 二进制直接运行。
        env:
          OSV_SHA256: bc98e15319ed0d515e3f9235287ba53cdc5535d576d24fd573978ecfe9ab92dc
        run: |
          curl -Lo /tmp/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v2.3.8/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  /tmp/osv-scanner" | sha256sum -c -
          chmod +x /tmp/osv-scanner

      - name: Generate CycloneDX SBOM (via Maven mirror)
        # 由 Maven 生成 SBOM（依赖解析走 settings.xml 镜像 + 本地缓存），
        # 使 OSV-Scanner 扫描阶段无需自行联网解析，彻底规避 Maven Central 429 限流。
        run: mvn -B org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom

      - name: OSV-Scanner (fail on known vulnerabilities)
        # 扫描 CycloneDX SBOM 而非 pom.xml，原因有二：
        # 1) OSV-Scanner v2.3.8 不支持 --strategy flag（会报 "flag provided but not defined"，exit 127）；
        # 2) 默认 pomxml 策略会自行向 repo.maven.apache.org 拉取父 POM，触发 429 限流。
        # 改为扫描 SBOM 后，依赖关系已由 Maven 解析完毕，扫描阶段不做任何外部依赖解析。
        #
        # 判定口径（2026-10-28 修复 CI #167 红灯根因）：
        #   v2.3.8 的 `[[IgnoredVulns]]` **只过滤输出、不影响退出码**——豁免命中后日志出现
        #   "Filtered 1 vulnerability from output"，进程仍 exit 1，形成「已豁免却点红」的假阳性。
        #   故本步不再直接采信扫描器退出码，改为**读 SARIF 中过滤后的结果条数**判定：
        #     · results 为空且 SARIF 结构完整 → 通过（豁免后确无残留漏洞）；
        #     · results 非空 → 失败并逐条打印（真有未豁免漏洞，门禁强度不降）；
        #     · SARIF 缺失/不可解析/无 runs/扫描器自报未成功 → 失败（不把工具故障误放行）。
        #
        # --config=osv-scanner.toml：与 .trivyignore 同口径的最小豁免集（三条均属 spring-framework
        # 6.2.x 无修复版、且触发路径经代码取证不可达，论证见该文件）：
        #   · GHSA-pc63-qcmh-9cmg / CVE-2026-47884（XsltView SSRF/RCE）
        #   · GHSA-j9f9-w8pj-32f8 / CVE-2026-47890（SSE + view fragments 流损坏）
        #   · GHSA-9qf2-26p9-2q2q / CVE-2026-47892（WebFlux 函数式端点 Header Predicate 绕过）
        # 可升级的 guava / snappy-java 已在 pom 锁定修复版，不在此豁免。
        run: |
          set +e
          /tmp/osv-scanner scan --format=sarif --output=osv-scan.sarif \
            --sbom=target/bom.json --config=osv-scanner.toml
          rc=$?
          echo "osv-scanner exit code: $rc"
          python3 - <<'PY'
          import json, os, sys

          path = "osv-scan.sarif"
          if not os.path.exists(path):
              print("::error::OSV-Scanner 未生成 SARIF（扫描器故障或参数错误），按失败处理")
              sys.exit(1)
          try:
              with open(path, encoding="utf-8") as fh:
                  data = json.load(fh)
          except Exception as exc:
              print(f"::error::SARIF 无法解析（{exc}），按失败处理")
              sys.exit(1)

          runs = data.get("runs") or []
          if not runs:
              print("::error::SARIF 无 runs 段（扫描未真正执行），按失败处理")
              sys.exit(1)

          total = sum(len(r.get("results") or []) for r in runs)
          exec_ok = all(
              inv.get("executionSuccessful", True)
              for r in runs
              for inv in (r.get("invocations") or [{}])
          )
          print(f"SARIF runs={len(runs)} results={total} executionSuccessful={exec_ok}")

          if total > 0:
              for r in runs:
                  for res in (r.get("results") or []):
                      rid = res.get("ruleId") or "?"
                      msg = ((res.get("message") or {}).get("text") or "").replace("\n", " ")[:140]
                      print(f"::error::未豁免漏洞 {rid}: {msg}")
              sys.exit(1)

          if not exec_ok:
              print("::error::扫描器自报执行未成功，按失败处理")
              sys.exit(1)

          print("OSV-Scanner: 过滤后 0 条未豁免漏洞 → 通过")
          PY

      - name: Upload OSV-Scanner report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osv-scanner-report
          path: backend/osv-scan.sarif
          retention-days: 14

  # ------------------------------------------------------------------
  # Docker：镜像构建校验（仅主干推送 / 手动触发，避免每个 PR 都做长耗时构建）
  # 验证 backend/Dockerfile 与 frontend/Dockerfile 在干净环境中可成功构建
  # ------------------------------------------------------------------
  docker:
    name: Docker Images Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images (no push)
        # 修复：docker-compose.yml 里全部 ${VAR:?...} 均在 `compose config` 阶段强制求值，
        # 缺一个即整份文件 interpolate 失败——即使该服务不参与 build。
        # 当前强制变量共 8 个：MYSQL_ROOT_PASSWORD / REDIS_PASSWORD / JWT_SECRET /
        # APP_ADMIN_INITIAL_PASSWORD（backend）/ NEO4J_PASSWORD（neo4j）/ GRAFANA_ADMIN_PASSWORD（grafana）/
        # COOKIE_SECURE / REQUIRE_HTTPS（backend，2026-11-06 起改为必填防静默降级）。
        # 2026-11-02 补后三个：主干 CI #213 的 Docker 作业正是停在
        # `required variable NEO4J_PASSWORD is missing a value`（该作业只在 push main 跑，PR 里 skipped，故长期未被发现）。
        # CI 仅构建镜像（不启动容器），使用 secrets 值（未配置时退化为 CI-only 构建值，不落盘）。
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD || 'ci-build-only-password-9f2k1m8x' }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD || 'ci-build-only-redis-7q4w2e9r' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-build-only-jwt-secret-0123456789abcdef0123456789abcdef' }}
          APP_ADMIN_INITIAL_PASSWORD: ${{ secrets.APP_ADMIN_INITIAL_PASSWORD || 'CiBuild0nly!Admin#2026' }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD || 'ci-test-neo4j-8f3k' }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD || 'ci-build-only-grafana-4p6t1s0d' }}
          # 仅参与插值求值（build 不启动容器）；取安全侧 true，与「默认安全」口径一致。
          COOKIE_SECURE: ${{ secrets.COOKIE_SECURE || 'true' }}
          REQUIRE_HTTPS: ${{ secrets.REQUIRE_HTTPS || 'true' }}
        # backend/frontend 属 profiles: ["full"]，kg/rag 属 ["python"]；
        # 两个 profile 必须同时启用，否则会漏掉 backend/frontend 的构建。
        run: docker compose --profile full --profile python -f docker-compose.yml build

  # ------------------------------------------------------------------
  # Python 知识图谱基线服务（端口 8001）契约校验
  # 覆盖 docs/系统架构设计.md 集成契约章节的关键端点，与 Java 端
  # KnowledgeGraphServiceImpl 的下游调用对齐。用 FastAPI TestClient
  # 内嵌运行，不依赖外部端口，稳定且快速。
  # ------------------------------------------------------------------
  python-kg-contract:
    name: Python KG Service Contract (8001)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python-services/kg_service
    # 缺陷修复（2026-10-04）：此前无 Neo4j 服务容器，`test_kg_contract.py` 中唯一
    # 直连真实图引擎的用例（_neo4j_store_or_skip）在 CI 恒 skip —— Neo4j 后端
    # 从未真正进过 PR 门禁，只有 fake driver 覆盖。requirements.txt 已装 neo4j 驱动，
    # 故此处起容器让其执行。容器是 CI 全新空库，且该用例只写 course_id=999 / :Kp
    # 并自行清理，不会与共享/本地图库数据冲突。
    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/ci-test-neo4j-8f3k
          NEO4J_dbms_memory_heap_max__size: 1G
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd="cypher-shell -u neo4j -p ci-test-neo4j-8f3k 'RETURN 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python-services/kg_service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Contract + unit tests (FastAPI TestClient)
        # 缺陷修复（2026-10-04）：原先只跑单文件契约测试（旧名 contract_test.py，
        # 现 test_kg_contract.py），`test_kg_store.py`（图存储双实现：内存基线 / Neo4j）
        # 里的 20+ 用例从未进过 PR 门禁。
        # 整目录跑：契约用例仍由 autouse fixture 强制内存后端（确定、不碰图库），
        # 真实引擎用例读取以下环境变量连到服务容器。
        env:
          NEO4J_URI: bolt://127.0.0.1:7687
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: ci-test-neo4j-8f3k
        run: pytest -q

  # ------------------------------------------------------------------
  # Python RAG 检索服务（端口 8002）契约校验
  # 覆盖 docs/系统架构设计.md 集成契约章节的关键端点，与 Java 端
  # RAGServiceImpl 的下游调用对齐。rag_service.py 已接真实混合检索引擎
  # （rag_engine.py：BM25+向量+RRF，重依赖懒加载），本 job 只跑无重依赖的用例。
  # ------------------------------------------------------------------
  python-rag-contract:
    name: Python RAG Service Contract (8002)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python-services/rag_service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python-services/rag_service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Contract + engine unit tests (FastAPI TestClient)
        # 缺陷修复（2026-10-04）：原先只跑单文件契约测试（旧名 contract_test.py，
        # 现 test_rag_contract.py），`test_rag_engine.py`
        # （BM25+向量+RRF 混合检索、分块、索引生命周期、损坏恢复等 29 例）从未进过 PR 门禁。
        # 引擎重依赖（numpy/jieba/rank_bm25/faiss/sentence-transformers）在 CI 不安装，
        # rag_engine 与用例都做了软依赖处理：缺依赖的用例按 skipif 自动跳过，纯算法用例照常跑。
        # 需要真实引擎全绿时另行安装 requirements-engine.txt（见 eval-nightly.yml）。
        run: pytest -q

  # ------------------------------------------------------------------
  # Python LoRA 微调服务（端口 8003）契约校验
  # 覆盖 docs/系统架构设计.md 集成契约章节的 8003 八端点 + 数据集/语料六端点，与 Java 端
  # LLMFineTuneServiceImpl / ContractPaths.java 的下游调用对齐。
  # lora_service.py 已接真实 PEFT 训练引擎（lora_engine.py，重依赖懒加载），
  # 本 job 只跑无重依赖的用例。
  # ------------------------------------------------------------------
  python-fine-tune-contract:
    name: Python LoRA Fine-Tune Service Contract (8003)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python-services/fine_tune_service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python-services/fine_tune_service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Contract + engine tests (FastAPI TestClient)
        # 引擎重依赖（torch/transformers/peft/datasets）在 CI 不安装：
        # lora_engine 与用例都做软依赖处理——缺依赖的真实训练用例按 skipif 跳过，
        # 纯逻辑与契约用例照常跑。
        # FT_ENGINE_READY=1 只是**结构开关**：让 /start 登记真实任务记录但不启动训练线程，
        # 使契约用例能断言 pending 形状而不与后台线程竞态。它不改变 mode 语义，
        # 也不产生任何占位成功响应——取证只认引擎真跑出的 mode=ENGINE。
        env:
          FT_ENGINE_READY: "1"
        run: pytest -q

  # ------------------------------------------------------------------
  # 启动器守卫（scripts/tests）—— 97 例，纯标准库 + pytest
  # 决策（DR-50 残项）：此前只在本机跑，两个 python 作业只扫 python-services/。
  # 启动器是"一键姿态"的唯一入口，它坏了没有任何门禁会说话，故单列一个作业。
  # 依赖面：仅 pytest（用例只用 monkeypatch / tmp_path / mock，不装 uvicorn、fastapi）。
  # ------------------------------------------------------------------
  launcher-tests:
    name: Launcher Guard Tests (scripts/tests)
    # 必须是 Windows runner（2026-10-30 修复 CI #168 红灯根因）：
    #   启动器（start.bat + scripts/start-all.py）是 Windows 专属实现，守卫用例按 Windows 语义
    #   写死路径断言——`os.pathsep` 拼 PATH、`pathlib.Path` 拼 `C:\WINDOWS\System32` 与
    #   `D:\jdk-21\bin\java.exe`。在 ubuntu-latest 上这些断言必然失败（#168 实测 10 条：
    #   `'C:\WINDOWS/System32' != 'C:\WINDOWS\System32'`、`None != 'D:\jdk-21'` 等）。
    #   取舍：改断言让它在 Linux 过＝放宽门禁；换回被测平台跑才是按真实语义取证。
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: pip install pytest

      - name: Launcher decision tests
        # 必须在仓库根执行：用例按 scripts/tests 的相对路径导入 scripts/*.py。
        run: python -m pytest scripts/tests -q

  # ------------------------------------------------------------------
  # 前端 E2E（Playwright）全栈冒烟测试  [P3 #5]
  # 决策：采用「全栈」方案——后端 jar 连 MySQL/Redis service 容器，前端构建后以
  # vite preview 提供静态资源（playwright.config.ts 经 PW_WEB_SERVER_COMMAND 覆盖 dev），
  # Playwright 跑真实 /api 链路。specs 直连真实 API（未做 page.route 桩），需后端+DB 在线。
  # 当前以 workflow_dispatch 手动触发，待补齐测试种子账号并确认 green 后再纳入 push/PR 默认门禁，
  # 避免在未就绪时污染受保护分支的自动 CI。本沙箱无 Actions runner / Playwright 浏览器，未实跑验证。
  # ------------------------------------------------------------------
  frontend-e2e:
    name: Frontend E2E (Playwright, full-stack)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: frontend
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: ci-test-password-8f3k
          MYSQL_DATABASE: ai_course_platform_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-test-password-8f3k"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7.4.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configure Maven mirror (avoid Maven Central HTTP 429)
        working-directory: backend
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings>
            <mirrors>
              <mirror>
                <id>google-maven-central</id>
                <mirrorOf>central</mirrorOf>
                <url>https://maven-central-eu.storage-download.googleapis.com/maven2/</url>
              </mirror>
            </mirrors>
          </settings>
          EOF

      - name: Build backend jar (skip tests)
        working-directory: backend
        env:
          SPRING_DATASOURCE_PASSWORD: ci-test-password-8f3k
          MYSQL_ROOT_PASSWORD: ci-test-password-8f3k
        run: mvn -B package -DskipTests

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start backend (background) + run Playwright
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/ai_course_platform_test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_PASSWORD: ci-test-password-8f3k
          JWT_SECRET: ci-e2e-jwt-secret-0123456789abcdef0123456789abcdef
          COOKIE_SECURE: "false"
          REQUIRE_HTTPS: "false"
          CSRF_ENABLED: "false"
          # DR-85：本作业 52 例真实登录，默认 10 次/60s 的 IP 桶会在第 11 次返 429 且不记日志，
          # 造成"红灯集合每轮不同"。该键**只允许**出现在此步骤 env（一次性进程环境）：
          # 禁止写入 .env / docker-compose.yml / scripts/start-all.py（那三处会让阈值长期生效）。
          RATELIMIT_LOGIN_LIMIT: "200"
          PW_WEB_SERVER_COMMAND: "npm run preview -- --port 5173 --strictPort"
        run: |
          java -jar ../backend/target/backend-0.0.1-SNAPSHOT.jar --server.port=8080 > ../backend-e2e.log 2>&1 &
          for i in $(seq 1 30); do
            # 探 probe 组并等真正的 200。两处纠正：
            #   1) 原判断 `[ -n "$code" ]` 在端口未监听时得到 "000"（非空）即 break，等于没等；
            #   2) 原探综合 /health，其聚合含 llmProvider，而本作业不注入 DEEPSEEK_API_KEY
            #      → 恒 503，就绪判定永远不成立（2026-10-07，手册 §25 / DR-28）。
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/actuator/health/probe || true)
            if [ "$code" = "200" ]; then echo "backend ready (http=$code, 第 ${i} 次探测)"; break; fi
            sleep 5
          done
          if [ "$code" != "200" ]; then echo "backend 未就绪，最后 http=$code"; tail -n 60 ../backend-e2e.log; exit 1; fi
          npx playwright test
          status=$?
          echo "---- backend-e2e.log (tail) ----"; tail -n 50 ../backend-e2e.log || true
          exit $status

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 14

  # ------------------------------------------------------------------
  # 上线补件静态自检（挂账清单汇总入口）
  #
  # 只证明「脚本存在、语法可用、静态分支可执行」；SKIP/PENDING 是预期结果，
  # 不代表 A#5/#6/#7/#8/#12 或 CI 部署已验收。真机上线前用 --strict 在目标
  # 主机执行（见 docs/部署文档.md §6.6）。
  # ------------------------------------------------------------------
  deploy-readiness:
    name: Deploy Readiness (static scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Static self-check
        run: python scripts/check-deploy-readiness.py

