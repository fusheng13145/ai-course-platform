name: Release

# 触发条件：main 分支打 v* 标签（如 v1.5.0）
# 流程：安全门禁 → 全量质量门禁 → 构建 Docker 镜像（tag 化）→ 生成 GitHub Release（含 Release Notes）
# 2026-11-14 P2-6（U5 收口）：此前 tag 触发的发布链不含 gitleaks/Trivy 门禁——
# 「tag 可绕过密钥门禁出镜像」（审计 U5）。现补 security-guards 作业前置拦截。
on:
  push:
    tags:
      - "v*"

# Release 需写入权限（创建 Release / 推送 GHCR 镜像）
permissions:
  contents: write
  packages: write

jobs:
  # ------------------------------------------------------------------
  # 安全门禁（与 ci.yml secret-scan / trivy-scan 同口径，2026-11-14 P2-6 补齐）：
  #   · gitleaks HEAD 内容扫描——tag 交付物里的真实密钥是最后防线；
  #   · Trivy vuln + misconfig 双门（m2 预填 + 版本钉版逐字复制 ci.yml，
  #     否则 Maven Central 429 会让扫描器自身报错点红，豁免口径见 .trivyignore 头部）。
  # OSV-Scanner（SBOM 口径）全量仍在 ci.yml 常驻跑：发布门禁以 trivy 覆盖
  # pom + package-lock 的 CVE 面，避免整段 CycloneDX 生成逻辑重复两处漂移。
  # ------------------------------------------------------------------
  security-guards:
    name: Security Guards (gitleaks + trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gitleaks HEAD 内容扫描（交付物密钥主门禁）
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            "$GITLEAKS_IMAGE" detect --no-git \
              --source=/repo \
              --config=/repo/.gitleaks.toml \
              --report-format sarif --report-path /repo/gitleaks-head.sarif \
              --redact --no-banner --exit-code 1

      - name: Upload gitleaks 报告（失败时用于定位）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gitleaks-report
          path: gitleaks-head.sarif
          retention-days: 14

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # 与 ci.yml trivy-scan 同款 m2 预填：trivy 解析 backend/pom.xml 会联网取父 POM，
      # Maven Central 429 时扫描器自身报错点红（非漏洞命中）——先经镜像预解析填 ~/.m2。
      - name: Populate local Maven cache (via mirror) before Trivy resolves POMs
        working-directory: backend
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'SETTINGS_EOF'
          <settings>
            <mirrors>
              <mirror>
                <id>google-maven-central</id>
                <mirrorOf>central</mirrorOf>
                <url>https://maven-central-eu.storage-download.googleapis.com/maven2/</url>
              </mirror>
            </mirrors>
          </settings>
          SETTINGS_EOF
          mvn -B -q dependency:resolve -DincludeScope=runtime

      - name: Trivy vuln gate（HIGH/CRITICAL 阻断发布）
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln"
          format: "table"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          trivyignores: ".trivyignore"
          version: "v0.69.3"
          exit-code: "1"

      - name: Trivy misconfig gate（按路径豁免口径 .trivyignore.yaml）
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "misconfig"
          format: "table"
          severity: "HIGH,CRITICAL"
          trivyignores: ".trivyignore.yaml"
          version: "v0.69.3"
          exit-code: "1"

  # ------------------------------------------------------------------
  # 质量门禁：后端 verify + 前端 lint/vitest/build（复用 ci.yml 关键步骤的精简版）
  # ------------------------------------------------------------------
  quality:
    name: Quality Gate (backend + frontend)
    needs: security-guards
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: ci-test-password-8f3k
          MYSQL_DATABASE: ai_course_platform_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-test-password-8f3k"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7.4.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      # 与 ci.yml 的 python-kg-contract 同口径（2026-10-04 补齐）：真实 Neo4j 图引擎
      # 用例需要服务容器，否则发布门禁会静默 skip 该用例 → 又回到「PR 门禁严于发布门禁」。
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/ci-test-neo4j-8f3k
          NEO4J_dbms_memory_heap_max__size: 1G
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd="cypher-shell -u neo4j -p ci-test-neo4j-8f3k 'RETURN 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # 修复 B4：仓库根无 pom.xml / mvnw（后端工程位于 backend/，与 ci.yml 的 backend job 一致），
      # 故本 step 必须显式 working-directory: backend，否则 `mvn -B verify` 在根目录必失败（首步即中断发布流水线）。
      # 注意：**不要**在 job 级加 defaults.run.working-directory——同 job 后续还有
      # frontend、python-services/kg_service、python-services/rag_service 三个 step，job 级 defaults 会连带影响。
      - name: Backend verify (unit + integration + JaCoCo gate)
        working-directory: backend
        # 与 ci.yml 的 backend job（`Build, unit & integration tests with coverage gate`，ci.yml:148-151）完全对齐：
        #   · MYSQL_ROOT_PASSWORD：application-local.yml 的数据源口令取 ${MYSQL_ROOT_PASSWORD:1234}，
        #     此处与上面 mysql service 的 root 口令对齐（SPRING_DATASOURCE_PASSWORD 亦指向同值）。
        #   · TESTCONTAINERS_RYUK_DISABLED：托管 runner 上 Ryuk 回收器偶发权限/检测问题，禁用后由 runner 销毁统一回收。
        env:
          SPRING_DATASOURCE_PASSWORD: ci-test-password-8f3k
          MYSQL_ROOT_PASSWORD: ci-test-password-8f3k
          TESTCONTAINERS_RYUK_DISABLED: true
        run: mvn -B verify jacoco:report

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend lint + test (coverage gate) + build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          # 修复 N-09：以下三道门禁此前只有 ci.yml 的 frontend-quality job 有，
          # 导致「PR 门禁严于发布门禁」，问题会一路漏到打 tag 发布才发现。
          # 现与 ci.yml:45-62 的口径完全对齐。
          npm run lint:api-refs
          npm run typecheck:gate
          npm run format:check
          # 接入覆盖率门禁：阈值未达标时 vitest 非零退出，阻断发布流水线
          npm run test:coverage
          npm run build

      - name: Python KG contract
        # 与 ci.yml 的 python-kg-contract 同口径：整目录跑（契约 + 图存储单测），
        # 并用上面的 neo4j service 执行真实图引擎用例（不再静默 skip）。
        # 契约用例本身由 autouse fixture 强制内存后端，不受这些变量影响。
        working-directory: python-services/kg_service
        env:
          NEO4J_URI: bolt://127.0.0.1:7687
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: ci-test-neo4j-8f3k
        run: |
          pip install -r requirements.txt pytest
          pytest -q

      # 与 ci.yml 对称：RAG 契约护栏同样纳入发布门禁（此前缺失，2026-08-27 补齐）
      - name: Python RAG contract
        # 与 ci.yml 的 python-rag-contract 同口径：整目录跑（契约 + 引擎单测）；
        # 发布门禁不装引擎重依赖（requirements-engine.txt），相应用例自动 skip。
        working-directory: python-services/rag_service
        run: |
          pip install -r requirements.txt pytest
          pytest -q

  # ------------------------------------------------------------------
  # Docker 镜像：tag 化构建并推送 GHCR（生产部署拉取源）
  # 依赖 quality job 通过
  # ------------------------------------------------------------------
  docker:
    name: Build & Push Docker Images
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 2026-11-14 P2-6（U5 收口）：与 ci.yml docker 作业同款磁盘腾挪——CI #238 实测
      # rag-service 的 torch 层曾把 runner 盘撑爆（no space left on device），发布构建
      # 构的是同一批镜像，不腾挪必复现。
      - name: 腾出磁盘（预装 SDK 占 ~20-30 GB）
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune -af || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 镜像 tag：ghcr.io/<owner>/<repo>/backend:v1.5.0 等（版本号取自 git tag）
      - name: Build & push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Python 引擎镜像（profile: python）。部署覆盖层 deploy/docker-compose.ghcr.yml
      # 已同步为同名 GHCR 路径；缺这两个镜像时 `--profile python` 部署会拉取失败。
      - name: Build & push kg-service image
        uses: docker/build-push-action@v7
        with:
          context: ./python-services/kg_service
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/kg-service:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/kg-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push rag-service image
        uses: docker/build-push-action@v7
        with:
          context: ./python-services/rag_service
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/rag-service:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/rag-service:latest
          build-args: |
            HF_ENDPOINT=https://hf-mirror.com
            RAG_EMBED_MODEL=BAAI/bge-small-zh-v1.5
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # FT 引擎镜像（profile: ft，2026-11-14 P2-6/U5b 补齐）：此前发布链不含 ft——
      # compose `--profile ft up` 必拉取失败。置于最后：前四镜像已推送，ft 失败仍可见
      # 且不回滚已交付镜像。Dockerfile 已按修复候选①（torch==2.11.0+cpu 本地版本号）
      # 改写阻断 CUDA 回落；本步即该修复的实机验证位。
      - name: Build & push fine-tune-service image
        uses: docker/build-push-action@v7
        with:
          context: ./python-services/fine_tune_service
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/fine-tune-service:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/fine-tune-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------
  # GitHub Release：自动生成 Release Notes（PR 标题聚合）
  # ------------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 拉取完整历史以生成 changelog

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          name: ${{ github.ref_name }}
          body: |
            ## AI Course Platform ${{ github.ref_name }}

            > 由 GitHub Actions 自动生成（tag: ${{ github.ref_name }}）

            ### 安装与部署
            - 本地构建：`docker compose up -d --build`（镜像名为 `aicourse/backend:local` / `aicourse/frontend:local`）
            - 拉取本 Release 的 GHCR 镜像：先设 `GHCR_REPO=ghcr.io/${{ github.repository }}`、`IMAGE_TAG=${{ github.ref_name }}`，
              再执行 `docker compose -f docker-compose.yml -f deploy/docker-compose.ghcr.yml pull` 与
              `docker compose -f docker-compose.yml -f deploy/docker-compose.ghcr.yml up -d --no-build`
            - 完整运维说明见 `docs/部署文档.md`

            ### 变更内容
            自动聚合自 PR 标题；完整变更记录见 Git History。
