name: Release

# 触发条件：main 分支打 v* 标签（如 v1.5.0）
# 流程：全量质量门禁 → 构建 Docker 镜像（tag 化）→ 生成 GitHub Release（含 Release Notes）
on:
  push:
    tags:
      - "v*"

# Release 需写入权限（创建 Release / 推送 GHCR 镜像）
permissions:
  contents: write
  packages: write

jobs:
  # ------------------------------------------------------------------
  # 质量门禁：后端 verify + 前端 lint/vitest/build（复用 ci.yml 关键步骤的精简版）
  # ------------------------------------------------------------------
  quality:
    name: Quality Gate (backend + frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: ci-test-password-8f3k
          MYSQL_DATABASE: ai_course_platform_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-test-password-8f3k"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7.4.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      # 与 ci.yml 的 python-kg-contract 同口径（2026-10-04 补齐）：真实 Neo4j 图引擎
      # 用例需要服务容器，否则发布门禁会静默 skip 该用例 → 又回到「PR 门禁严于发布门禁」。
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/ci-test-neo4j-8f3k
          NEO4J_dbms_memory_heap_max__size: 1G
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd="cypher-shell -u neo4j -p ci-test-neo4j-8f3k 'RETURN 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # 修复 B4：仓库根无 pom.xml / mvnw（后端工程位于 backend/，与 ci.yml 的 backend job 一致），
      # 故本 step 必须显式 working-directory: backend，否则 `mvn -B verify` 在根目录必失败（首步即中断发布流水线）。
      # 注意：**不要**在 job 级加 defaults.run.working-directory——同 job 后续还有
      # frontend、python-services/kg_service、python-services/rag_service 三个 step，job 级 defaults 会连带影响。
      - name: Backend verify (unit + integration + JaCoCo gate)
        working-directory: backend
        # 与 ci.yml 的 backend job（`Build, unit & integration tests with coverage gate`，ci.yml:148-151）完全对齐：
        #   · MYSQL_ROOT_PASSWORD：application-local.yml 的数据源口令取 ${MYSQL_ROOT_PASSWORD:1234}，
        #     此处与上面 mysql service 的 root 口令对齐（SPRING_DATASOURCE_PASSWORD 亦指向同值）。
        #   · TESTCONTAINERS_RYUK_DISABLED：托管 runner 上 Ryuk 回收器偶发权限/检测问题，禁用后由 runner 销毁统一回收。
        env:
          SPRING_DATASOURCE_PASSWORD: ci-test-password-8f3k
          MYSQL_ROOT_PASSWORD: ci-test-password-8f3k
          TESTCONTAINERS_RYUK_DISABLED: true
        run: mvn -B verify jacoco:report

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend lint + test (coverage gate) + build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          # 修复 N-09：以下三道门禁此前只有 ci.yml 的 frontend-quality job 有，
          # 导致「PR 门禁严于发布门禁」，问题会一路漏到打 tag 发布才发现。
          # 现与 ci.yml:45-62 的口径完全对齐。
          npm run lint:api-refs
          npm run typecheck:gate
          npm run format:check
          # 接入覆盖率门禁：阈值未达标时 vitest 非零退出，阻断发布流水线
          npm run test:coverage
          npm run build

      - name: Python KG contract
        # 与 ci.yml 的 python-kg-contract 同口径：整目录跑（契约 + 图存储单测），
        # 并用上面的 neo4j service 执行真实图引擎用例（不再静默 skip）。
        # 契约用例本身由 autouse fixture 强制内存后端，不受这些变量影响。
        working-directory: python-services/kg_service
        env:
          NEO4J_URI: bolt://127.0.0.1:7687
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: ci-test-neo4j-8f3k
        run: |
          pip install -r requirements.txt pytest
          pytest -q

      # 与 ci.yml 对称：RAG 契约护栏同样纳入发布门禁（此前缺失，2026-08-27 补齐）
      - name: Python RAG contract
        # 与 ci.yml 的 python-rag-contract 同口径：整目录跑（契约 + 引擎单测）；
        # 发布门禁不装引擎重依赖（requirements-engine.txt），相应用例自动 skip。
        working-directory: python-services/rag_service
        run: |
          pip install -r requirements.txt pytest
          pytest -q

  # ------------------------------------------------------------------
  # Docker 镜像：tag 化构建并推送 GHCR（生产部署拉取源）
  # 依赖 quality job 通过
  # ------------------------------------------------------------------
  docker:
    name: Build & Push Docker Images
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 镜像 tag：ghcr.io/<owner>/<repo>/backend:v1.5.0 等（版本号取自 git tag）
      - name: Build & push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Python 引擎镜像（profile: python）。部署覆盖层 deploy/docker-compose.ghcr.yml
      # 已同步为同名 GHCR 路径；缺这两个镜像时 `--profile python` 部署会拉取失败。
      - name: Build & push kg-service image
        uses: docker/build-push-action@v7
        with:
          context: ./python-services/kg_service
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/kg-service:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/kg-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push rag-service image
        uses: docker/build-push-action@v7
        with:
          context: ./python-services/rag_service
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/rag-service:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/rag-service:latest
          build-args: |
            HF_ENDPOINT=https://hf-mirror.com
            RAG_EMBED_MODEL=BAAI/bge-small-zh-v1.5
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------
  # GitHub Release：自动生成 Release Notes（PR 标题聚合）
  # ------------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 拉取完整历史以生成 changelog

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          name: ${{ github.ref_name }}
          body: |
            ## AI Course Platform ${{ github.ref_name }}

            > 由 GitHub Actions 自动生成（tag: ${{ github.ref_name }}）

            ### 安装与部署
            - 本地构建：`docker compose up -d --build`（镜像名为 `aicourse/backend:local` / `aicourse/frontend:local`）
            - 拉取本 Release 的 GHCR 镜像：先设 `GHCR_REPO=ghcr.io/${{ github.repository }}`、`IMAGE_TAG=${{ github.ref_name }}`，
              再执行 `docker compose -f docker-compose.yml -f deploy/docker-compose.ghcr.yml pull` 与
              `docker compose -f docker-compose.yml -f deploy/docker-compose.ghcr.yml up -d --no-build`
            - 完整运维说明见 `docs/部署文档.md`

            ### 变更内容
            自动聚合自 PR 标题；完整变更记录见 Git History。
