# ============================================================
# AI 课程平台 - Alertmanager 配置
# 挂载到 /etc/alertmanager/alertmanager.yml（docker-compose alertmanager 服务）
#
# 【通知渠道】默认路由到 ops-email（QQ SMTP 587+STARTTLS，授权码经 compose secrets
# 从 deploy/secrets/alertmanager_smtp_password 挂载到 /etc/alertmanager/smtp_password，
# 不入 git）。monitor profile 启动前须确保该密钥文件存在（与 actuator_basic_password 同规约）。
# 企业微信/钉钉/飞书等 webhook 渠道可在 receivers 追加，url 必须写字面值。
#
# 【重要 · 不支持环境变量插值】
# Alertmanager 不支持配置文件内的通用 ${VAR} / ${VAR:-default} 展开
# （该能力仅存在于少数 *_file 后缀字段的外部密钥读取，且语义不同）。
# 若此处写 ${ALERTMANAGER_WEBHOOK_URL:-...}，Alertmanager 会把整个字符串
# 当作字面 URL 解析并启动失败：
#   err="parse \"${ALERTMANAGER_WEBHOOK_URL:-http://localhost:9000/alerts}\":
#        first path segment in URL cannot contain colon"
# 因此本文件一律使用**字面值**。如需按环境参数化，请任选其一：
#   (a) 部署前用 envsubst / sed 生成本文件；
#   (b) 在 compose 中改用 configs + 自定义 entrypoint 做模板渲染；
#   (c) 各环境维护独立的 alertmanager.yml 并按需挂载。
# ============================================================

global:
  resolve_timeout: 5m

route:
  receiver: "ops-email"
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # 严重告警缩短重复通知间隔，确保第一时间持续触达
    - matchers:
        - severity = "critical"
      receiver: "ops-email"
      repeat_interval: 1h

receivers:
  # 邮件通知（2026-11-14 接入，替代原 localhost:9000 占位 webhook）。
  # - 授权码不进本文件：经 compose secrets 挂载到 /etc/alertmanager/smtp_password
  #   （deploy/secrets/alertmanager_smtp_password，gitignored），由 auth_password_file 读取。
  # - QQ SMTP 走 587+STARTTLS（465 是隐式 TLS，Alertmanager 不支持隐式 SSL 拨号，
  #   require_tls 对应 STARTTLS 语义）。
  # - 发件/收件邮箱为运维信箱字面值（本文件不支持 ${VAR} 插值，见文件头说明）；
  #   更换收件人时改 to 即可。
  - name: "ops-email"
    email_configs:
      - smarthost: 'smtp.qq.com:587'
        from: '3039613979@qq.com'
        to: '3039613979@qq.com'
        auth_username: '3039613979@qq.com'
        auth_password_file: '/run/secrets/alertmanager_smtp_password'
        require_tls: true
        send_resolved: true

  # 后续若接入企业微信/钉钉/飞书机器人，可追加 webhook receiver 并在 route 中分流；
  # 注意：本文件不支持 ${VAR} 插值（见文件头说明），url 必须写**字面值**。

# 同实例的 critical 告警抑制其 warning 告警，避免噪音叠加
inhibit_rules:
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ["alertname", "instance"]
