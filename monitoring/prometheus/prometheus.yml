# AI Course Platform - Prometheus 抓取配置
# 挂载到 /etc/prometheus/prometheus.yml（docker compose monitor profile）
#
# 鉴权说明：
# 生产环境 APP_ACTUATOR_SECURED=true 时，/api/actuator/prometheus 要求 HTTP Basic 鉴权
# （凭据来自后端 APP_ACTUATOR_BASIC_USER/PASSWORD）。若口令不匹配，抓取以 401 失败
# （fail-closed，便于第一时间发现配置缺失，而不是静默无指标）。
#
# ⚠️ **Prometheus 不会对配置文件做环境变量插值**（2026-10-07 真机 A/B 实测，v2.53.0）：
#   同一容器、同一网络、同一目标，`basic_auth.password: "${ACTUATOR_BASIC_PASSWORD}"`
#   的抓取结果为 401（整串按字面量发出），把同一口令写成字面值则 target `up`。
#   本文件此前声称"原生支持 ${VAR} 插值（v2.24+）"是错的——照它接线会让**应用侧指标全缺**
#   而监控面板/告警规则仍显示组件健康（只有 backend 这一个 job 静默失效）。
#   同目录 alertmanager.yml 头部记过同一条规则（Alertmanager 亦然），当时没推广到 Prometheus。
# 因此口令改用 Prometheus 真实支持的 `password_file`，文件由 docker-compose 的顶层 `secrets:`
#   挂载到 `/run/secrets/actuator_basic_password`（与 backend 的 DR-24 落点同一套机制，
#   配置文件里不落明文；准备方式与两个坑——末尾换行、Linux 下 nobody 可读——见 compose 尾部注释）；
#   用户名非机密，在此字面写死。**若改 .env 的 APP_ACTUATOR_BASIC_USER，必须同步改下面
#   username 这一行**，否则抓取以 401 fail-closed（可见失败，不会静默采到脏数据）。

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 告警规则：由 alert_rules.yml 定义；评估周期同 evaluation_interval（15s）
rule_files:
  - "/etc/prometheus/alert_rules.yml"

# 告警分发：推送至同网络内的 Alertmanager（docker-compose alertmanager 服务）。
# 注意：Alertmanager 未启动时 Prometheus 仅无法外发告警，自身抓取与规则评估不受影响。
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "aicourse-backend"
    metrics_path: "/api/actuator/prometheus"
    scheme: http
    basic_auth:
      username: "monitor"
      password_file: "/run/secrets/actuator_basic_password"
    static_configs:
      - targets: ["backend:8080"]

  - job_name: "promtail"
    # 抓取 Promtail 自身 metrics 端点（server.http_listen_port=9080），
    # 获取 promtail_custom_log_lines_total{level} 用于错误日志突增告警。
    static_configs:
      - targets: ["promtail:9080"]

  # 宿主机系统指标（CPU/内存/磁盘/网络）：支撑 DiskUsageHigh 等系统告警。
  # node-exporter 以 host 网络命名空间运行，抓取目标即其容器名（docker DNS 解析到 host 网卡）。
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  # ---------------- 监控组件自监控（meta-monitoring） ----------------
  # 抓取监控链路各组件自身 /metrics，使 up{job=~"prometheus|alertmanager|loki|grafana|promtail"}
  # 全部纳入监控；任一组件宕机（尤其 Alertmanager）将触发 MonitoringComponentDown 告警。
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]
  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]
  - job_name: "grafana"
    # 依赖 docker-compose grafana 服务的 GF_METRICS_ENABLED=true 暴露 /metrics
    static_configs:
      - targets: ["grafana:3000"]
