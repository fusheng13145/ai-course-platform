# ============================================================
# AI 课程平台 - Docker Compose 编排
# 服务：mysql / redis / backend / frontend
#
# 【Redis 必选】backend 通过 depends_on.condition=service_healthy
# 强依赖 MySQL 与 Redis 两者；Redis 未就绪时 backend 不会启动，
# 与应用内 RedisStartupValidator（启动 PING 强校验）双重保障。
# Redis 认证：REDIS_PASSWORD 现为必填项（docker compose 缺失即拒绝启动），
# 设置后自动启用 requirepass 并同步到后端。
#
# 【使用路径】
# 1) 本地开发（默认，推荐）：start-backend.bat 优先使用本机 MySQL(3306) / Redis(6379)；
#    本机缺失时脚本自动兜底：MySQL 走本编排的容器(宿主 3307)，Redis 可 `docker compose up -d redis`。
#    本编排仅作基础设施兜底，不参与后端/前端启动。
# 2) 容器化部署（上线/给他人快速体验/本机无 MySQL、Redis 时）：
#    docker compose --profile full up -d --build
#    （backend/frontend 带 profiles:["full"]，不加 --profile 仅起 mysql + redis 两个基础设施）。
# 敏感配置经同级 .env 注入（见 .env.example），禁止默认值上线。
# ============================================================

services:
  mysql:
    image: mysql:8.0
    container_name: aicourse-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 必须设置（请 cp .env.example .env 后填入至少16位强密码）}
      MYSQL_DATABASE: ai_course_platform
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: aicourse-redis
    restart: unless-stopped
    # 密码安全：REDIS_PASSWORD 现为必填项（见 docker-compose 顶层 required 约束）；
    # 设置后自动启用 requirepass，后端经 SPRING_DATA_REDIS_PASSWORD 同步连接。
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD 必须设置（请 cp .env.example .env 后填入强密码）}
    command: ["sh", "-c", "if [ -n \"$REDIS_PASSWORD\" ]; then exec redis-server --appendonly yes --requirepass \"$REDIS_PASSWORD\"; else exec redis-server --appendonly yes; fi"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$REDIS_PASSWORD\" ]; then redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG; else redis-cli ping | grep -q PONG; fi"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: ./backend
    container_name: aicourse-backend
    restart: unless-stopped
    profiles: ["full"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ai_course_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&useUnicode=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 必须设置（请 cp .env.example .env 后填入至少32位随机密钥）}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # 安全开关：默认宽松（http://80 快速体验）；生产置于 TLS 反代之后时必须置 true
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      REQUIRE_HTTPS: ${REQUIRE_HTTPS:-false}
      CSRF_ENABLED: ${CSRF_ENABLED:-false}
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/api/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  frontend:
    build:
      context: ./frontend
    container_name: aicourse-frontend
    restart: unless-stopped
    profiles: ["full"]
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  mysql-data:
  redis-data:
