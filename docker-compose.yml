# ============================================================
# AI 课程平台 - Docker Compose 编排
# 服务：mysql / redis / backend / frontend
#       + mysql-backup（备份守护，profiles: ops）
#       + prometheus / grafana / loki / promtail（监控+日志，profiles: monitor）
#
# 【Redis 必选】backend 通过 depends_on.condition=service_healthy
# 强依赖 MySQL 与 Redis 两者；Redis 未就绪时 backend 不会启动，
# 与应用内 RedisStartupValidator（启动 PING 强校验）双重保障。
# Redis 认证：REDIS_PASSWORD 现为必填项（docker compose 缺失即拒绝启动），
# 设置后自动启用 requirepass 并同步到后端。
#
# 【使用路径】
# 1) 本地开发（默认，推荐）：start.bat（all / backend）只连本机 MySQL(3306) / Redis(6379)，
#    缺件即 fail-fast 并回项目主——脚本内**没有任何 docker 分支**（原"探测 3307 则切数据源"已删除）。
#    本编排只作基础设施兜底，且需人工显式启动，不参与后端/前端的自动拉起。
# 2) 容器化部署（上线/给他人快速体验/本机无 MySQL、Redis 时）：
#    docker compose --profile full up -d --build
#    （backend/frontend 带 profiles:["full"]，不加 --profile 仅起 mysql + redis 两个基础设施）。
# 3) 运维增强（可选，按需叠加 profile）：
#    docker compose --profile full --profile ops up -d --build     # + MySQL 每日自动备份
#    docker compose --profile full --profile monitor up -d --build # + Prometheus/Grafana 监控 + Alertmanager 告警 + Loki/Promtail 日志集中化
#    （ops 与 monitor 可同时叠加：--profile full --profile ops --profile monitor）
#    告警通知渠道：monitor profile 默认启动 Alertmanager，默认 webhook 占位端点；
#    生产请在 .env 设置 ALERTMANAGER_WEBHOOK_URL 指向真实告警网关（企业微信/钉钉/飞书机器人等）。
#    日志集中化：monitor profile 默认启动 Loki（存储）+ Promtail（采集 backend 容器日志），
#    经 Grafana 的 Loki 数据源检索；Promtail 经 Docker socket 采集，无需改动应用代码。
# 敏感配置经同级 .env 注入（见 .env.example），禁止默认值上线。
#
# ============================================================
# 【命名与分组规范】（2026-10-06 收敛，全部资源归到同一个可识别的项目族）
#
# 1) 编排项目名固定为 `aicourse`（下方顶层 name）。Compose 派生的网络/卷名
#    因此统一为 `aicourse_default` / `aicourse_mysql-data` …，不再随 checkout
#    目录名变化（以前在 `ai-course-platform` / `大创赛` 等不同目录里跑会得到
#    不同前缀，是「同一项目却散落多处」的主要来源）。
# 2) 自建镜像显式命名到 `aicourse/` 仓库前缀下（backend、frontend），第三方镜像
#    保留上游名不改名、不复制（改名会造成同一镜像双份占用磁盘，且无法与上游
#    安全更新对照）。Docker Desktop 的 Images 视图按仓库前缀分组，于是
#    `aicourse/*` 天然聚成「本项目」一族。
# 3) 每个服务带三个标签，命令行按标签一键筛出本项目资源：
#      docker ps  -a --filter label=aicourse.project=ai-course-platform
#      docker volume ls --filter label=com.docker.compose.project=aicourse
#    （卷只带 compose 内建标签：Docker 仅在**创建时**写卷标签，给既有卷补自定义标签
#      只能重建卷＝删数据，故不自定义。卷名已统一为 `aicourse_<name>` 前缀，
#      `--filter name=aicourse_` 同样有效。2026-10-07 真机实测确认。）
#    `aicourse.tier` 再按 infra / app / ops / monitor / python 分层，
#    `aicourse.role` 标识服务角色，便于批量重启与排查。
# 4) 宿主端口**全部默认只绑 127.0.0.1**（含前端入口，需要给同组同学访问时显式
#    FRONTEND_HOST_BIND=0.0.0.0），且端口号可用 .env 覆盖：
#    数字默认值保持不变（3307/6379/8080/80…），
#    因为 start.bat 与各文档已按这些数字写明兜底路径；改的只是
#    「谁能在网络上访问到」而不是「监听哪个号」。冲突时改宿主端口即可：
#      MYSQL_HOST_PORT / REDIS_HOST_PORT / BACKEND_HOST_PORT /
#      FRONTEND_HTTP_PORT / PROMETHEUS_HOST_PORT / ALERTMANAGER_HOST_PORT /
#      GRAFANA_HOST_PORT / LOKI_HOST_PORT / NEO4J_HTTP_PORT / NEO4J_BOLT_PORT
# 5) 第三方镜像固定到「补丁级」标签（见各 image 行），禁用 `latest`：
#    可复现构建 + 升级时能明确 diff。核对上游实际版本的方式：
#      docker run --rm <image> --version
#
# 【旧卷迁移】若此前用别的目录名跑过本编排，卷前缀不同（如
# `ai-course-platform_mysql-data`）。切到 `aicourse` 后 compose 会新建空卷，
# 旧数据不会自动跟上。先 `docker volume ls` 确认，必要时用旧前缀跑一次
# （`docker compose --project-name ai-course-platform ...`）把数据导出后再导入。
# ============================================================

name: aicourse

# ---- 公共标签锚点（Compose 支持 YAML 锚点；已用 `docker compose config` 验证）----
x-labels-base: &labels-base
  aicourse.project: ai-course-platform
  aicourse.managed-by: docker-compose
x-labels-infra: &labels-infra
  <<: *labels-base
  aicourse.tier: infra
x-labels-app: &labels-app
  <<: *labels-base
  aicourse.tier: app
x-labels-ops: &labels-ops
  <<: *labels-base
  aicourse.tier: ops
x-labels-monitor: &labels-monitor
  <<: *labels-base
  aicourse.tier: monitor

services:
  mysql:
    # 补丁级固定：本机 `docker run --rm --entrypoint mysqld mysql:8.4 --version`
    # 实测 8.4.11，且 mysql:8.4.11 与 mysql:8.4 解析到同一镜像 ID（6ea90827b110），
    # 所以这个 pin 不改变行为，只是让「跑的是哪个补丁版」在文件里可见、可复现。
    image: mysql:8.4.11
    container_name: aicourse-mysql
    labels:
      <<: *labels-infra
      aicourse.role: database
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 必须设置（请 cp .env.example .env 后填入至少16位强密码）}
      MYSQL_DATABASE: ai_course_platform
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      # 仅绑回环：编号沿用文档/脚本约定的 3307（本机原生 MySQL 占 3306 时的兜底口），
      # 但不再暴露到 0.0.0.0。需要给同组同学远程访问时显式设 MYSQL_HOST_BIND=0.0.0.0。
      - "${MYSQL_HOST_BIND:-127.0.0.1}:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 最小权限账户初始化：首次建库时创建 aicourse_app（替代 root 直连），详见 scripts/init-app-db-user.sh
      - ./scripts/init-app-db-user.sh:/docker-entrypoint-initdb.d/10-create-app-user.sh:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          # 【必须写 $$】与下方 redis 的 REDIS_PASSWORD 同理：单 $ 会被 Compose 在生成
          # 容器配置阶段就地展开，把明文 root 口令固化进容器元数据（`docker inspect` 可直接读出）；
          # 写 $$ 后 Compose 输出字面 $MYSQL_ROOT_PASSWORD，交由容器内从 environment 展开。
          "-p$$MYSQL_ROOT_PASSWORD",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7.4.11-alpine
    container_name: aicourse-redis
    labels:
      <<: *labels-infra
      aicourse.role: cache
    restart: unless-stopped
    # 密码安全：REDIS_PASSWORD 现为必填项（见 docker-compose 顶层 required 约束）；
    # 设置后自动启用 requirepass，后端经 SPRING_DATA_REDIS_PASSWORD 同步连接。
    #
    # 【重要 · 必须用 $$ 转义】command / healthcheck 中引用 REDIS_PASSWORD 时
    # 必须写 $$REDIS_PASSWORD（双美元号）。若写单 $，Compose 会在生成容器配置阶段
    # 就地展开，导致：
    #   (1) 明文密码被固化进容器 Cmd 元数据，`docker inspect` 可直接读出；
    #   (2) 若密码本身含 $ 字符，Compose 会把 $xxx 当作变量引用并展开为空串，
    #       使实际 requirepass 被截断成残留片段（曾实测降级为单字符）。
    # 写 $$ 后 Compose 输出字面 $REDIS_PASSWORD，交由容器内 sh 从 environment 展开。
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD 必须设置（请 cp .env.example .env 后填入强密码）}
    command:
      [
        "sh",
        "-c",
        'if [ -n "$$REDIS_PASSWORD" ]; then exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"; else exec redis-server --appendonly yes; fi',
      ]
    ports:
      # 宿主口默认同样取 6379：目的是"用容器顶替本机 Redis"时后端无需改配置。
      # ⚠️ 本机路径不会自动用上这个容器——start.bat 只探本机 6379（scripts/start-all.py 的 CACHE_PORT），
      #   既不拉容器也不读 REDIS_HOST_PORT。本机已跑原生 Redis 时二者抢同一个口，必须二选一：
      #   停掉原生服务，或设 REDIS_HOST_PORT=16379 之类换掉宿主侧端口（容器内仍是 6379，
      #   compose 形态的 backend 走服务名 redis:6379 不受影响，换口只影响"从宿主机直连"这一用法）。
      # 与 mysql 同理只绑回环：requirepass 之外再加一层不可达保护。
      - "${REDIS_HOST_BIND:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG; else redis-cli ping | grep -q PONG; fi',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: ./backend
    # 显式命名到 aicourse/ 前缀：镜像列表里与第三方基础镜像分族，
    # 也让 `docker rmi aicourse/backend:local` 之类的清理动作目标明确。
    image: aicourse/backend:local
    container_name: aicourse-backend
    labels:
      <<: *labels-app
      aicourse.role: api
    restart: unless-stopped
    profiles: ["full"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ai_course_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&useUnicode=true
      SPRING_DATASOURCE_USERNAME: aicourse_app
      # 修复 #21：优先使用独立的业务库账户口令 MYSQL_APP_PASSWORD；仅在未设置时回退到 MYSQL_ROOT_PASSWORD。
      # 注意：若改为独立账户口令，需同步为 mysql 服务创建 aicourse_app 账户并授权（见 init-app-db-user.sh）。
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_APP_PASSWORD:-${MYSQL_ROOT_PASSWORD}}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 必须设置（请 cp .env.example .env 后填入至少32位随机密钥）}
      # 种子 admin 初始口令（修复：index.sql 内置弱口令账号，生产必须注入强口令替换；
      # 留空 = 不启用替换。见 AdminSeedPasswordInitializer）
      APP_ADMIN_INITIAL_PASSWORD: ${APP_ADMIN_INITIAL_PASSWORD:?生产须注入强管理员口令（prod profile 下缺之则启动 fail-fast）}
      # 演示账号开关（修复 F-02 P1）：容器编排即生产姿态，默认关闭 →
      # 启动时把仍是出厂弱口令(123456)的种子演示账号停用并重置为不可知随机口令。
      # 仅本地体验场景可在 .env 显式置 true（勿与 prod profile 同时使用）。
      DEMO_ACCOUNTS_ENABLED: ${DEMO_ACCOUNTS_ENABLED:-false}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # 供应商与端点（DR-84）：默认值与 application.yaml 一致，不填行为不变；
      # 容器形态若要接自建网关，必须在此注入（同 DR-73 教训：yml 有落点而编排到不了＝调不动且不报错）。
      AI_PROVIDER: ${AI_PROVIDER:-deepseek}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # 安全开关：**默认安全**，不因本文件的部署形态把生产默认值降到 false。
      # ⚠️ 纠偏（2026-09-16）：原注释只写「本地 HTTP 联调由本机启动器经 local profile 放宽」，
      #   该句仅覆盖 start.bat 这条路径，对 `docker compose --profile full` **完全不适用** —— 这正是缺陷根源。
      #   事实：`--profile full` 起的是**明文 HTTP 单机栈**（frontend/nginx.conf 只 listen 80、compose 无证书卷，
      #   不存在任何 TLS 终止）。因此必须按部署形态显式决策：
      #     · 纯 HTTP 评估（仅限本机 / 受信内网）：**必须显式**在 .env 置 REQUIRE_HTTPS=false 与 COOKIE_SECURE=false，
      #       否则 /api/** 被 SecurityConfig.requiresSecure() 302 到不存在的 443 → 全站 API 不可用（README「方式二」路径①）。
      #     · 置于 TLS 终止反代之后的生产：**必须保持 true**，且反代须回传 X-Forwarded-Proto: https（README「方式二」路径②）。
      #   CSRF_ENABLED 在两种形态下都应保持 true。
      # 明文 HTTP 单机栈（--profile full 默认形态，无 TLS 终止、无证书卷）必须 false，否则 /api/** 被 302 到不存在的 443 → 全站 API 不可用。
      # 生产置于 TLS 终止反代之后：置 true 且反代回传 X-Forwarded-Proto: https。
      # ⚠ 2026-10-17 更正：本行旧文案写「后端已启用 forward-headers-strategy: framework」已过期——
      #   现行值是 **none**（backend/src/main/resources/application.yaml:131），协议修正改由
      #   config/TrustedForwardedProtoFilter 只读 X-Forwarded-Proto 完成（手册 DR-66）。
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      REQUIRE_HTTPS: ${REQUIRE_HTTPS:-false}
      CSRF_ENABLED: ${CSRF_ENABLED:-true}
      # 客户端 IP 取值来源（2026-09-16 上线前全检新增）：修复「伪造 X-Forwarded-For 逐请求换头
      # 绕过登录失败节流 / IP 限流」的 🔴 缺陷（详见 TrustedClientIpResolver 类注释）。
      #   本栈边缘代理是 frontend(nginx)，nginx.conf 已改用 $remote_addr **覆写** X-Real-IP 与
      #   X-Forwarded-For，故默认信任之并取 X-Real-IP——即便有人把 XFF 改回追加语义，节流键仍不可伪造。
      #   ⚠ 该开关的前提是「应用只经受信 nginx 暴露」。若需接受不可信来源直连，必须置 false。
      # 注：本文件已设 SPRING_PROFILES_ACTIVE: prod（见下），application-prod.yml 在本路径下生效；
      #   此处显式透传仅用于覆盖 prod 配置之外的运行时值（与上方 COOKIE_SECURE / REQUIRE_HTTPS 同一原因）。
      # 激活 prod profile：使 application-prod.yml 真正生效（闭合 N-02 影子配置）。
      SPRING_PROFILES_ACTIVE: prod
      TRUST_PROXY_HEADER: ${TRUST_PROXY_HEADER:-true}
      # 跨域白名单（逗号分隔的真实前端域名）；留空 = 不开放跨域。
      # 【修复 2026-09-16】原注释写「留空 = fail-closed」与实现不符：SecurityConfig 在
      # origins 为空时回退看 app.cors.dev-fallback（默认 true）→ 会放行 http://localhost:5173
      # 且带 allowCredentials。容器编排即生产姿态，故此处显式把兜底关掉（fail-closed）。
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      APP_CORS_DEV_FALLBACK: ${APP_CORS_DEV_FALLBACK:-false}
      # 监控端点（/api/actuator/prometheus）鉴权：独立 Basic 鉴权链（与业务 JWT 链路隔离，非 ADMIN 角色）。
      # 凭据为监控专用账号 APP_ACTUATOR_BASIC_USER / APP_ACTUATOR_BASIC_PASSWORD，口令留空则抓取 fail-closed；
      # 启用 monitor profile 且无反向代理鉴权时（内网/演示），可置 false 放开 Prometheus 抓取。
      APP_ACTUATOR_SECURED: ${APP_ACTUATOR_SECURED:-true}
      # 监控抓取专用 Basic 账号（Prometheus 经 basic_auth 抓取 /api/actuator/prometheus）。
      # 凭据须与下方 prometheus 服务的 ACTUATOR_BASIC_* 完全一致；口令留空则抓取 fail-closed。
      APP_ACTUATOR_BASIC_USER: ${APP_ACTUATOR_BASIC_USER:-monitor}
      APP_ACTUATOR_BASIC_PASSWORD: ${APP_ACTUATOR_BASIC_PASSWORD:-}
      # Python 微服务集成开关（默认关闭：KG/RAG 引擎由团队另一成员负责，未启用时
      # /knowledge/path/plan 本地 BFS 兜底、AI 问答自动回退纯 LLM）。
      # 启用步骤：解注下方 kg-service / rag-service，再置 KG_ENABLED/RAG_ENABLED=true。
      KG_ENABLED: ${KG_ENABLED:-false}
      KG_BASE_URL: ${KG_BASE_URL:-http://kg-service:8001}
      RAG_ENABLED: ${RAG_ENABLED:-false}
      RAG_BASE_URL: ${RAG_BASE_URL:-http://rag-service:8002}
      FT_ENABLED: ${FT_ENABLED:-false}
      FT_BASE_URL: ${FT_BASE_URL:-http://fine-tune-service:8003}
      TZ: Asia/Shanghai
    ports:
      # ⚠ 直连暴露提示（2026-09-16 上线前全检）：本端口把后端**绕过 nginx** 直接发布到宿主机，
      #   而安全决策用的客户端 IP 取自代理头 → 攻击者不经 nginx、直接请求 :8080 并伪造
      #   X-Real-IP / X-Forwarded-For，即可让 (IP, 账号) 节流键随伪造值漂移，绕过限流。
      #   生产若无需宿主机直连后端，建议收紧为 "127.0.0.1:8080:8080"（仅本机可访问）或直接删除本段，
      #   对外只暴露 frontend 的 80。此项属部署姿态决策，已收紧为 127.0.0.1（仅本机可访问）。
      - "${BACKEND_HOST_BIND:-127.0.0.1}:${BACKEND_HOST_PORT:-8080}:8080"
    healthcheck:
      # 探 `probe` 组（readinessState + database + redis + diskSpace），**不探综合 /health**：
      # 综合状态含 llmProvider，缺 DEEPSEEK_API_KEY 时恒 DOWN（503）→ 本探针永不过、
      # frontend 的 depends_on: service_healthy 卡死，未配 AI Key 的机器整栈起不来（2026-10-07 实测）。
      # AI 能力缺失按契约降级为抽取式回答，不属"实例不可服务"，故不计入探活（手册 §40 / §25）。
      test: ["CMD", "curl", "-fs", "http://localhost:8080/api/actuator/health/probe"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    volumes:
      # 上传文件持久化（修复：原未挂卷，容器重建后 uploads/ 下所有教学资源/附件丢失；
      # 与 UploadResourceConfig 静态映射及 ResourceController 落盘目录 /app/uploads 对齐）
      - uploads-data:/app/uploads
      # 数据库备份持久化：应用内「系统管理→备份」生成的 backups/ 目录落盘到卷，
      # 容器重建不丢失（配合 mysql-backup 服务的定时全量备份构成双保险）
      - backups-data:/app/backups
    logging:
      # json-file 日志限额：单文件 10MB × 3 份，防止日志无限膨胀占满磁盘
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------- Python 微服务（引擎就绪后解注启用，归入 python profile） ----------------
  # KG/RAG 引擎由团队另一成员负责（当前 python-services/ 下为契约基线/占位骨架）。
  # 接入步骤：① 解注下方对应服务 ② .env 置 KG_ENABLED=true / RAG_ENABLED=true
  # ③ docker compose --profile full --profile python up -d
  # ----------------
  # kg-service:
  #   build:
  #     context: ./python-services/kg_service
  #     dockerfile: Dockerfile   # 需队友补充（uvicorn kg_service:app --host 0.0.0.0 --port 8001）
  #   container_name: aicourse-kg-service
  #   restart: unless-stopped
  #   profiles: ["python"]
  #   ports:
  #     - "8001:8001"
  #   healthcheck:
  #     test: ["CMD", "curl", "-fs", "http://localhost:8001/api/v1/graph/health"]
  #     interval: 15s
  #     timeout: 5s
  #     retries: 5
  #
  # rag-service:
  #   build:
  #     context: ./python-services/rag_service
  #     dockerfile: Dockerfile   # 需队友补充（uvicorn rag_service:app --host 0.0.0.0 --port 8002）
  #   container_name: aicourse-rag-service
  #   restart: unless-stopped
  #   profiles: ["python"]
  #   ports:
  #     - "8002:8002"
  #   healthcheck:
  #     test: ["CMD", "curl", "-fs", "http://localhost:8002/api/v1/rag/health"]
  #     interval: 15s
  #     timeout: 5s
  #     retries: 5
  #
  # fine-tune-service（8003）：LoRA 微调引擎。**引擎侧已交付**（python-services/fine_tune_service，
  # 契约见 docs/项目手册.md 第八部分 §37；本机 pytest 53 passed，手册 DR-78），但**尚无 Dockerfile**，
  # 且未纳入 scripts/start-engines.py / start-all.py 一键范围 → 服务块仍按 kg/rag 同形保持注释，
  # 补出 Dockerfile 后参照上述模板放开（profiles: ["python"]）。

  # ---------------- MySQL 定时备份守护（profiles: ops） ----------------
  mysql-backup:
    # 补丁级固定：本机 `docker run --rm --entrypoint mysqld mysql:8.4 --version`
    # 实测 8.4.11，且 mysql:8.4.11 与 mysql:8.4 解析到同一镜像 ID（6ea90827b110），
    # 所以这个 pin 不改变行为，只是让「跑的是哪个补丁版」在文件里可见、可复现。
    image: mysql:8.4.11
    container_name: aicourse-mysql-backup
    labels:
      <<: *labels-ops
      aicourse.role: db-backup
    restart: unless-stopped
    profiles: ["ops"]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ai_course_platform
      # 保留天数：超出即滚动清理
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      # 备份周期（秒），默认 86400 = 每日一轮；由下方守护循环的 sleep 消费（容器侧展开，故写 $$）。
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      # 异地同步（可选）：如 oss:aicourse-backups / s3:bucket/path，需镜像内置 rclone；留空跳过
      BACKUP_REMOTE_SYNC: ${BACKUP_REMOTE_SYNC:-}
      TZ: Asia/Shanghai
    volumes:
      - ./backup/mysql-backup.sh:/backup.sh:ro
      - mysql-backups:/backups
    entrypoint:
      - /bin/sh
      - -c
      # 【2026-10-07 真机首启修正 · DR-29】原写 `chmod +x /backup.sh && exec /bin/sh /backup.sh`，
      # 但上面的挂载是 :ro → 容器内 chmod 报 "Read-only file system" → `&&` 短路，
      # 备份脚本从未执行过，sh 以 1 退出并被 restart: unless-stopped 无限重启
      # （实测 RestartCount=10、日志只有 chmod 失败）。故直接用 sh 调脚本，不需要执行位。
      # 另外脚本本身是**一次性**导出（内部无循环/无 sleep），若仍按原结构 exec 单跑退出，
      # restart 策略会把它变成「每几秒一次 mysqldump」的死循环，与 §32/README 宣称的
      # 「每日全量 + 滚动保留」不符 → 所以这里补上守护循环；单轮失败不静默，
      # 退避 300s 再试（持续失败仍是可观测的，日志里每轮都带时间戳）。
      - 'while :; do if /bin/sh /backup.sh; then sleep $$BACKUP_INTERVAL_SECONDS; else echo "[backup] 本轮失败，300s 后重试"; sleep 300; fi; done'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  # ---------------- Prometheus 监控采集（profiles: monitor） ----------------
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: aicourse-prometheus
    labels:
      <<: *labels-monitor
      aicourse.role: metrics
    restart: unless-stopped
    profiles: ["monitor"]
    environment:
      # 【2026-10-07 真机修正 · DR-30】Prometheus **不对配置文件做环境变量插值**：
      # 原写法 `basic_auth.username/password: "${ACTUATOR_BASIC_*}"` 会把整串当字面量发出，
      # backend 抓取恒 401 → 应用侧指标全缺，而其余 6 个 job 与面板/告警仍显示健康（静默失效）。
      # 真机 A/B 取证：同容器同网络下 `${VAR}` 形态 401、同口令写成字面值则 target `up`。
      # 现改走 Prometheus 真实支持的 `password_file`，凭据由本文件的顶层 `secrets:` 挂载
      # 到 /run/secrets（与 backend 的 DR-24 落点同一套机制，见 docs/部署文档.md 的文件式密钥章节）。
      # 用户名非机密、只能字面写死：须与 prometheus.yml 的 username: "monitor"
      # 及 backend 的 APP_ACTUATOR_BASIC_USER 三者一致，不一致则 401 fail-closed。
      TZ: Asia/Shanghai
    secrets:
      - actuator_basic_password
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_HOST_BIND:-127.0.0.1}:${PROMETHEUS_HOST_PORT:-9090}:9090"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  # ---------------- Node Exporter 宿主机指标采集（profiles: monitor） ----------------
  # 采集宿主机 CPU/内存/磁盘/网络指标（node_* 系列），支撑磁盘使用率告警
  # （DiskUsageHigh，见 monitoring/prometheus/alert_rules.yml）。容器以 host 网络命名空间运行，
  # 通过挂载只读 /proc /sys / 根目录提供指标来源；node-exporter 本身不开放对外端口。
  # ⚠️ 「宿主机」只在 Linux 裸机/VM 成立（DR-31，2026-10-07 真机实测）：Docker Desktop 上
  #   pid: host 与 /proc /sys / 解析到的是那个 Linux 虚拟机，实测 node_filesystem_avail_bytes
  #   只有 /dev/sdd → /mnt/docker-desktop-disk（虚拟盘，按需膨胀，永不逼近真实容量），
  #   node_uname_info 的 nodename 是 VM 主机名而非本机。因此 DiskUsageHigh 在 Windows/macOS
  #   开发机上**不会因宿主盘写满而触发**，不能当交付前的磁盘门禁；Linux 生产侧语义正确，无需改动。
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: aicourse-node-exporter
    labels:
      <<: *labels-monitor
      aicourse.role: host-metrics
    restart: unless-stopped
    profiles: ["monitor"]
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  # ---------------- Alertmanager 告警分发（profiles: monitor） ----------------
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: aicourse-alertmanager
    labels:
      <<: *labels-monitor
      aicourse.role: alerting
    restart: unless-stopped
    profiles: ["monitor"]
    # 【注意】此处曾注入 ALERTMANAGER_WEBHOOK_URL 环境变量，但 Alertmanager
    # 不支持在 alertmanager.yml 内做 ${VAR} 插值，该变量实际无任何效果，
    # 反而使配置文件里的占位符被当作字面 URL 解析而启动失败（CrashLoop）。
    # 故移除该变量；webhook 地址请直接在 monitoring/prometheus/alertmanager.yml 中写字面值。
    volumes:
      - ./monitoring/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "${ALERTMANAGER_HOST_BIND:-127.0.0.1}:${ALERTMANAGER_HOST_PORT:-9093}:9093"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  # ---------------- Grafana 可视化面板（profiles: monitor） ----------------
  grafana:
    image: grafana/grafana:11.2.0
    container_name: aicourse-grafana
    labels:
      <<: *labels-monitor
      aicourse.role: dashboard
    restart: unless-stopped
    profiles: ["monitor"]
    depends_on:
      - prometheus
    environment:
      # 生产必须通过 .env 覆盖默认弱口令！缺失即拒绝启动，杜绝 admin/admin 上线。
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD 必须设置（请 cp .env.example .env 后填入强密码，禁止默认 admin/admin）}
      # 暴露 Grafana 自身 /metrics（Prometheus 抓取 grafana:3000/metrics，纳入监控组件存活告警）
      GF_METRICS_ENABLED: "true"
      TZ: Asia/Shanghai
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_HOST_BIND:-127.0.0.1}:${GRAFANA_HOST_PORT:-3000}:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  # ---------------- Loki 日志存储（profiles: monitor） ----------------
  loki:
    image: grafana/loki:2.9.8
    container_name: aicourse-loki
    labels:
      <<: *labels-monitor
      aicourse.role: log-store
    restart: unless-stopped
    profiles: ["monitor"]
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./monitoring/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "${LOKI_HOST_BIND:-127.0.0.1}:${LOKI_HOST_PORT:-3100}:3100"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  # ---------------- Promtail 日志采集（profiles: monitor） ----------------
  promtail:
    image: grafana/promtail:2.9.8
    container_name: aicourse-promtail
    labels:
      <<: *labels-monitor
      aicourse.role: log-collector
    restart: unless-stopped
    profiles: ["monitor"]
    depends_on:
      - loki
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/loki/promtail-config.yaml:/etc/promtail/config.yml:ro
      # 经 Docker socket 服务发现后端容器日志（只读）；本地 Docker 桌面默认可用
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  frontend:
    build:
      context: ./frontend
    image: aicourse/frontend:local
    container_name: aicourse-frontend
    labels:
      <<: *labels-app
      aicourse.role: edge
    restart: unless-stopped
    profiles: ["full"]
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # 前端是本栈的对外入口，但默认仍只绑回环：本机评估/浏览器验证够用，
      # 不把 80 端口随手开放到局域网。需要同学从别的机器访问时显式开：
      #   FRONTEND_HOST_BIND=0.0.0.0 docker compose --profile full up -d
      # 【DR-34】容器侧端口 80 → 8080：nginx 以 uid=101 运行，绑不了 <1024 的特权端口。
      #   **宿主机侧不变**（默认 80），所以 http://localhost/ 与后端 CORS 白名单无需改动；
      #   改的是 nginx.conf 的 listen，两处必须同步（见 frontend/nginx.conf 头注）。
      - "${FRONTEND_HOST_BIND:-127.0.0.1}:${FRONTEND_HTTP_PORT:-80}:8080"
    logging:
      # json-file 日志限额：与 backend 一致，防止日志膨胀
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ===================== 知识图谱存储 Neo4j（Python 侧，profile: rag）=====================
  # kg_service（8001）的 Neo4j 后端；凭据参数化至 .env
  # 启动方式：docker compose --profile rag up -d
  neo4j:
    image: neo4j:5-community
    container_name: aicourse-neo4j
    labels:
      <<: *labels-infra
      aicourse.role: graph-store
    profiles: ["rag"]
    ports:
      - "${NEO4J_HOST_BIND:-127.0.0.1}:${NEO4J_HTTP_PORT:-7474}:7474"   # Neo4j Browser (HTTP)
      - "${NEO4J_HOST_BIND:-127.0.0.1}:${NEO4J_BOLT_PORT:-7687}:7687"   # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD 必须设置（请 cp .env.example .env 后填入）}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_pagecache_size=512M
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
  redis-data:
  uploads-data:
  # 定时备份卷（mysql-backup 服务写入）
  mysql-backups:
  # 应用内手动备份卷（SystemServiceImpl backups/ 目录）
  backups-data:
  # 监控数据卷
  prometheus-data:
  grafana-data:
  # Loki 日志数据卷
  loki-data:
  # Neo4j 数据卷（RAG profile，知识图谱存储）
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:

# ===================== 文件式凭据（Compose secrets，非 Swarm 也支持） =====================
# 挂载落点固定为容器内 `/run/secrets/<secret 名>`，与 backend 的 Spring configtree 落点同一套机制
# （见 docs/部署文档.md 的文件式密钥章节与 DR-24）。
# ⚠️ 源目录沿用仓库既有约定 `deploy/secrets/`（已被 .gitignore 的 `deploy/secrets/*` 排除，
#    仅保留 .gitkeep，不会入库）；不想落在仓库内可用 `ACTUATOR_BASIC_PASSWORD_FILE=/abs/path`。
# ⚠️ 内容 = 口令本身，**末尾不要换行**（Prometheus 读 password_file 会把换行当作口令的一部分 → 恒 401）：
#   printf %s "$APP_ACTUATOR_BASIC_PASSWORD" > deploy/secrets/actuator_basic_password
# ⚠️ Linux 上还需让容器内 UID 65534（prometheus 进程用户 nobody）可读：chmod 644 该文件；
#    否则挂载成功但读不到，同样表现为 backend 抓取 401（Windows/Docker Desktop 无此问题，已实测）。
secrets:
  actuator_basic_password:
    file: ${ACTUATOR_BASIC_PASSWORD_FILE:-./deploy/secrets/actuator_basic_password}

