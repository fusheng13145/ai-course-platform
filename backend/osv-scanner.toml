[[IgnoredVulns]]
id = "GHSA-pc63-qcmh-9cmg"
reason = """
CVE-2026-47884（spring-webmvc，XsltView 的 SSRF/RCE，CRITICAL）。

【无修复版可用】OSV 影响范围把 6.2.0–6.2.19 标为 last_affected（6.2.x 线不再发修复版），
唯一修复版是 7.0.9，属 Spring Framework 7 / Spring Boot 4 大版本迁移，不在本轮修复范围。

【触发路径不可达——三项取证，缺一不得豁免】
1) 漏洞前提是启用 XsltView 做服务端视图渲染：backend 的 src/main/java 与 src/main/resources
   全量检索 XsltView / ViewResolver / setViewName / Thymeleaf / FreeMarker / Velocity 均 0 命中。
2) 前提是存在「未显式指定视图名」的视图解析：45 个控制器全部为 @RestController（直接写响应体，
   不进 ViewResolver 链），无一个裸 @Controller；前端是独立 Vue SPA，只消费 JSON API。
3) 前提是 `/**` 请求映射落到视图渲染：仓库内唯一 `/**` 是 SecurityConfig.java:395 的
   registerCorsConfiguration("/**", ...)，为 CORS 匹配器而非 handler mapping。

【复核触发条件】Spring Boot 升到管理 Framework 7.0.9+ 后立即删除本条；
或后端一旦引入任何服务端模板/XSLT 视图解析，本豁免当即失效并须重新评估。
"""
