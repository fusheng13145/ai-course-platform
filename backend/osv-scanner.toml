# OSV-Scanner 漏洞豁免配置
#
# 铁律（2026-10-07 收紧，见手册 §24.2.3 根因 B）：**能升级的绝不豁免**。
# 本清单由「按 OSV 逐包实查 → 区分有无修复版 → 无修复版再论证可达性」三步生成，
# 每条都要写明触发条件与复核时机；升级完成后必须回来删除对应条目。
#
# 与 .trivyignore 保持同一口径（两处豁免必须同步，否则一个门禁绿、一个门禁红）。
#
# ---------------------------------------------------------------------------
# 已删除的历史豁免（不要恢复）：GHSA-9xv2-5v5q-p794 / GHSA-h3x4-894j-xpx5 /
# GHSA-gcx9-497g-6cp6（3 条 Tomcat CRITICAL）。原「修复版未发布」的挡不住升级：
# OSV 记修复版 10.1.58，Central 无该版但有 10.1.59/10.1.60，故 `tomcat.version=10.1.60`
# 直接升级（≥ 修复版即不受影响）。升级后 OSV 复查 tomcat-embed-core 10.1.60 = 0 命中。
