# OSV-Scanner 漏洞豁免配置
#
# 铁律（2026-10-07 收紧，见手册 §24.2.3 根因 B）：**能升级的绝不豁免**。
# 本清单由「按 OSV 逐包实查 → 区分有无修复版 → 无修复版再论证可达性」三步生成，
# 每条都要写明触发条件与复核时机；升级完成后必须回来删除对应条目。
#
# 与 .trivyignore 保持同一口径（两处豁免必须同步，否则一个门禁绿、一个门禁红）。
#
# ---------------------------------------------------------------------------
# 已删除的历史豁免（不要恢复）：GHSA-9xv2-5v5q-p794 / GHSA-h3x4-894j-xpx5 /
# GHSA-gcx9-497g-6cp6（3 条 Tomcat CRITICAL）。原「修复版未发布」的挡不住升级：
# OSV 记修复版 10.1.58，Central 无该版但有 10.1.59/10.1.60，故 `tomcat.version=10.1.60`
# 直接升级（≥ 修复版即不受影响）。升级后 OSV 复查 tomcat-embed-core 10.1.60 = 0 命中。
# ---------------------------------------------------------------------------

[[IgnoredVulns]]
id = "GHSA-pc63-qcmh-9cmg"
reason = """
CVE-2026-47884（spring-webmvc，XsltView 的 SSRF/RCE，CRITICAL）。

【无修复版可用】OSV 影响范围把 6.2.0–6.2.19 标为 last_affected（6.2.x 线不再发修复版），
唯一修复版是 7.0.9，属 Spring Framework 7 / Spring Boot 4 大版本迁移，不在本轮修复范围。

【触发路径不可达——三项取证，缺一不得豁免】
1) 漏洞前提是启用 XsltView 做服务端视图渲染：backend 的 src/main/java 与 src/main/resources
   全量检索 XsltView / ViewResolver / setViewName / Thymeleaf / FreeMarker / Velocity 均 0 命中。
2) 前提是存在「未显式指定视图名」的视图解析：48 个控制器全部为 @RestController（直接写响应体，
   不进 ViewResolver 链），无一个裸 @Controller；前端是独立 Vue SPA，只消费 JSON API。
3) 前提是 `/**` 请求映射落到视图渲染：仓库内唯一 `/**` 是 SecurityConfig.java:395 的
   registerCorsConfiguration("/**", ...)，为 CORS 匹配器而非 handler mapping。

【复核触发条件】Spring Boot 升到管理 Framework 7.0.9+ 后立即删除本条；
或后端一旦引入任何服务端模板/XSLT 视图解析，本豁免当即失效并须重新评估。
"""

[[IgnoredVulns]]
id = "GHSA-j9f9-w8pj-32f8"
reason = """
CVE-2026-47890（spring-webmvc / spring-webflux，SSE + view fragments 的流损坏，CRITICAL / CVSS 9.8）。

【无修复版可用】GitHub Advisory 中 6.2.0–6.2.19 的 first_patched_version 为 None（6.2.x 线不再发修复版），
唯一修复版 7.0.9，属 Spring Framework 7 / Spring Boot 4 大版本迁移，不在本轮范围。

【触发路径不可达——三项取证，缺一不得豁免】
1) 全仓唯一 SSE 端点是 AIController.streamChat（GET /api/ai/qa/stream），返回 Flux<String>，
   每帧为 JSON 字符串（{"token":...} / {"sources":[...]}），由 Spring MVC 响应式桥接直接写入响应体。
2) 「view fragments」前提不成立：Rendering / Fragment API 调用 0 命中（Fragment 仅作为
   PlagiarismCheckServiceImpl 的 originalFragment/matchedFragment 字段名出现，是查重文本字段，与视图无关）；
   ViewResolver / setViewName / XsltView 均 0 命中；pom.xml 未引入 thymeleaf/freemarker/velocity/mustache。
3) 该端点不返回 ModelAndView、不指定视图名，不进入视图渲染链；48 个控制器全部为 @RestController。

【复核触发条件】Spring Boot 升到管理 Framework 7.0.9+ 后立即删除本条；
或 SSE 响应一旦引入任何视图/片段渲染（Rendering/Fragment/模板引擎），本豁免当即失效。
"""

[[IgnoredVulns]]
id = "GHSA-9qf2-26p9-2q2q"
reason = """
CVE-2026-47892（spring-webflux，WebFlux functional endpoints 的 Header Predicate 绕过，CRITICAL / CVSS 9.8）。

【无修复版可用】同上：6.2.0–6.2.19 的 first_patched_version 为 None，唯一修复版 7.0.9。

【触发路径不可达——两项取证】
1) 前提是「WebFlux 应用使用函数式端点并由 DispatcherServlet 部署」：全仓 RouterFunction /
   RouterFunctions / HandlerFilterFunction / org.springframework.web.reactive.function.server 均 0 命中。
2) WebFlux 在本项目仅作**出站 HTTP 客户端**：唯一使用点是 OpenAiCompatibleProvider 的 WebClient
   （调 LLM 服务），服务端仍是 Spring MVC，不存在 WebFlux 服务端栈。

【复核触发条件】Spring Boot 升到管理 Framework 7.0.9+ 后立即删除本条；
或一旦引入 WebFlux 函数式端点 / RouterFunction，本豁免当即失效。
"""

