# ===================== local profile 测试覆盖（仅 test 类路径） =====================
# 测试类路径下的 application-local.yml 会覆盖 main 中的同名文件，
# 使 AuthFlowIntegrationTest（@ActiveProfiles("local")）无需外部环境变量即可运行：
#   - jwt.secret 固定为测试密钥（main 版读 ${JWT_SECRET:} 为空 → WeakKeyException）
#   - datasource password 回退 1234（main 版无默认值 → Access denied）
# 仅存在于 src/test/resources，绝不进入生产构建。

ai:
  deepseek:
    api-key: test-dummy-key

jwt:
  secret: test-only-jwt-key-for-auth-flow-tests-do-not-use-in-prod

spring:
  # 数据库迁移：本地测试禁用 Flyway，保持 sql.init 用 index.sql 重建（防双重初始化）
  flyway:
    enabled: false

  datasource:
    # 独立测试库，与开发库隔离；上下文启动时由 sql.init 用 index.sql 重建 schema+种子
    url: jdbc:mysql://localhost:3306/ai_course_platform_test?createDatabaseIfNotExist=true&useSSL=false&requireSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&useUnicode=true
    password: ${MYSQL_ROOT_PASSWORD:1234}
    hikari:
      maximum-pool-size: 20
  sql:
    init:
      mode: always
      schema-locations: classpath:index.sql
      continue-on-error: false

logging:
  level:
    com.aicourse: WARN

app:
  actuator:
    secured: false
  cookie:
    secure: false
  security:
    require-https: false
  swagger:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
