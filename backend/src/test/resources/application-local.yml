# ===================== local profile 测试覆盖（仅 test 类路径） =====================
# 测试类路径下的 application-local.yml 会覆盖 main 中的同名文件，
# 使 AuthFlowIntegrationTest（@ActiveProfiles("local")）无需外部环境变量即可运行：
#   - jwt.secret 固定为测试密钥（main 版读 ${JWT_SECRET:} 为空 → WeakKeyException）
#   - datasource password 回退 1234（main 版无默认值 → Access denied）
# 仅存在于 src/test/resources，绝不进入生产构建。
#
# 【修复 2026-09-16】sql.init 原先指向 classpath:index.sql，而该脚本内嵌
#   `CREATE DATABASE IF NOT EXISTS ai_course_platform; USE ai_course_platform;` → 强制切库。
# 后果与 contract-test profile 同源（详见 application-contract-test.yml 头部）：
#   ① 本 profile 指向的 ai_course_platform_test 永远建不出表；
#   ② 运行该集成测试会 DROP/重建**开发库** ai_course_platform。
#   改用 database-agnostic 的 db/migration/V1__init_schema.sql（无 CREATE DATABASE/USE，
#   内容与 index.sql 一致），隔离性由连接 URL 保证。切勿改回 index.sql。

ai:
  deepseek:
    api-key: test-dummy-key

jwt:
  secret: test-only-jwt-key-for-auth-flow-tests-do-not-use-in-prod

spring:
  # 数据库迁移：本地测试禁用 Flyway，保持 sql.init 用 index.sql 重建（防双重初始化）
  flyway:
    enabled: false

  datasource:
    # 独立测试库，与开发库隔离；上下文启动时由 sql.init 用 index.sql 重建 schema+种子
    url: jdbc:mysql://localhost:3306/ai_course_platform_test?createDatabaseIfNotExist=true&useSSL=false&requireSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&useUnicode=true
    password: ${MYSQL_ROOT_PASSWORD:1234}
    hikari:
      maximum-pool-size: 20
  sql:
    init:
      mode: always
      schema-locations: classpath:db/migration/V1__init_schema.sql
      continue-on-error: false

logging:
  level:
    com.aicourse: WARN

app:
  actuator:
    secured: false
  cookie:
    secure: false
  security:
    require-https: false
  swagger:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
