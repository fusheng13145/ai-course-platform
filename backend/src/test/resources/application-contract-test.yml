# ===================== API 契约测试配置（contract-test profile） =====================
# ApiContractTest 使用本地 MySQL/Redis 而非 Testcontainers（该类不继承 AbstractIntegrationTest，
# 原 test profile 会退化为主配置的 localhost 数据源但密码为空 → Access denied）。
#
# 【修复（2026-09-15）】原先 sql.init 指向 classpath:index.sql，但该脚本内嵌
#   `CREATE DATABASE IF NOT EXISTS ai_course_platform; USE ai_course_platform;`
#   → 脚本会强制切库到开发库。后果有两条，均已实测：
#     ① 本 profile 指向的 ai_course_platform_test 永远建不出表 → ApiContractTest 11 个用例
#        全部报 “Table 'ai_course_platform_test.users' doesn't exist”；
#     ② 每次 `mvn test` 都会 DROP/重建**开发库** ai_course_platform（实测其表 create_time
#        被打成当次运行时刻），文件头原声称的「与开发库完全隔离」不成立，构成数据丢失风险。
#   现改用 database-agnostic 的 db/migration/V1__init_schema.sql（该脚本无 CREATE DATABASE/USE，
#   见其第 19 行说明；内容与 index.sql 完全一致：48 DROP / 48 CREATE / 9 种子 INSERT），
#   使其作用于连接 URL 指定的 ai_course_platform_test，隔离性由 URL 而非脚本保证。
#   仍保持 mode: always → 每次跑测试都重建测试库，保证用例不依赖上一轮残留状态。
spring:
  # 数据库迁移：契约测试由 sql.init 重建测试库，Flyway 关闭以避免双重初始化
  flyway:
    enabled: false

  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false

  datasource:
    # 独立测试库（createDatabaseIfNotExist 自动创建），与开发库 ai_course_platform 完全隔离，
    # 由 sql.init 在上下文启动时重建 schema + 种子数据，测试不依赖开发库数据状态
    url: jdbc:mysql://localhost:3306/ai_course_platform_test?createDatabaseIfNotExist=true&useSSL=false&requireSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&useUnicode=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${SPRING_DATASOURCE_PASSWORD:1234}
    hikari:
      maximum-pool-size: 10

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000

  # 测试库专用：上下文启动时执行 V1__init_schema.sql（DROP+CREATE+种子），保证库结构/种子自愈。
  # 注意必须使用**不含 CREATE DATABASE / USE** 的脚本，否则会切库到开发库（见本文件头部说明）；
  # 切勿改回 index.sql，也不要在此处新增 application.yaml 的 sql.init 覆盖以外的脚本。
  sql:
    init:
      mode: always
      schema-locations: classpath:db/migration/V1__init_schema.sql
      continue-on-error: false

  # 邮件：账号密码留空 → EmailServiceImpl 走「模拟发送」分支，不发真实邮件
  mail:
    host: localhost
    port: 3025
    username:
    password:
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false

# MyBatis-Plus：关闭 SQL 控制台打印，降低日志噪声
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 禁用依赖外部 Python 服务的组件，避免上下文启动时的健康检查/连接失败
knowledge-graph:
  enabled: false
rag:
  enabled: false
fine-tune:
  enabled: false

# 限流依赖 Redis（本机已运行），保持开启

# 测试环境 HTTP 访问：关闭 HTTPS 强制 / Secure Cookie / CSRF
app:
  actuator:
    secured: false
  cookie:
    secure: false
  security:
    require-https: false
    csrf:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

# 测试专用 JWT 签名密钥（仅测试使用，切勿用于生产）
jwt:
  secret: test-only-signing-key-for-contract-tests-0123456789abcdef
  expiration: 604800000
  session-expiration: 86400000

logging:
  level:
    com.aicourse: INFO
