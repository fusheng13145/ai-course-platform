# ===================== 真实库手工验收配置（real-db profile） =====================
# 仅供 RosterRealDbIT 手工执行使用（环境变量 AICP_REAL_DB_IT=true 才启用）。
# 直连开发库 ai_course_platform，只读结构、不做 sql.init、不做 Flyway；
# 测试整体在事务内执行并回滚，不改变持久化数据。
spring:
  flyway:
    enabled: false
  sql:
    init:
      mode: never
  datasource:
    url: jdbc:mysql://localhost:3306/ai_course_platform?useSSL=false&requireSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&useUnicode=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${SPRING_DATASOURCE_PASSWORD:1234}
    hikari:
      maximum-pool-size: 5
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knowledge-graph:
  enabled: false
rag:
  enabled: false
fine-tune:
  enabled: false

app:
  actuator:
    secured: false
  cookie:
    secure: false
  security:
    require-https: false
    csrf:
      enabled: false

jwt:
  secret: test-only-signing-key-for-real-db-checks-0123456789abcdef
  expiration: 604800000
  session-expiration: 86400000

# 最小上下文不加载自定义 HealthIndicator（database/redis/diskSpace），
# 覆盖 application.yaml 的 probe 组，避免健康组校验失败。
management:
  endpoint:
    health:
      group:
        probe:
          include: readinessState

logging:
  level:
    com.aicourse: INFO
