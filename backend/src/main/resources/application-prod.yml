# ===================== prod profile（生产姿态，显式激活） =====================
# 激活方式：SPRING_PROFILES_ACTIVE=prod
#
# 【存在理由（2026-09-16 新增）】本文件此前**不存在**，导致代码里若干
# 「生产必须…否则 fail-fast」的分支实际不可达——没有任何 profile 能触发它们，
# 例如 DemoAccountHardeningInitializer 的「enabled=true 与 prod 不能共存」守卫。
# 本文件把这些姿态默认值落成实体，使其成为**可执行**的开关，而非纸面约定。
#
# 设计原则：
#   1. 本文件只做「收紧」，不引入任何新功能；
#   2. 不提供任何密钥默认值——缺失即启动失败，不做弱兜底；
#   3. 与 docker-compose.yml 的环境变量默认口径保持一致（两条部署路径同姿态）。

app:
  # 演示账号：生产必须关闭 → 启动时停用「仍为出厂弱口令(123456)」的演示账号并重置为不可知口令。
  # 若同时置 true 且激活 prod，DemoAccountHardeningInitializer 会 fail-fast 拒绝启动。
  # 另注意：加固会停用内置 admin，若未提供 APP_ADMIN_INITIAL_PASSWORD 且无其它有效 ADMIN 账号，
  #         启动同样会被拒绝（防止「零管理员」静默锁死）。
  demo-accounts:
    enabled: false

  # CORS 本地开发兜底：生产关闭。
  # 置 false 后，若未显式配置 cors.allowed-origins，则拒绝一切跨域（fail-closed），
  # 而不会回退到「带 allowCredentials 的 http://localhost:5173」。
  cors:
    dev-fallback: false

  # Swagger/OpenAPI 文档：生产不对外暴露完整 API 文档。
  swagger:
    enabled: false

  # Actuator：除 /api/actuator/prometheus（经独立 Basic 鉴权链）外一律拒绝；
  # 凭据由 APP_ACTUATOR_BASIC_USER/PASSWORD 提供，留空则抓取 fail-closed。
  actuator:
    secured: true

  # HTTP 安全姿态：置于 TLS 反代之后的生产环境须全为 true（默认与主配置一致，保持安全）。
  # ❗修复 B3（2026-09-16 上线前全检）：require-https 由**硬编码 true** 改为 `${REQUIRE_HTTPS:true}`。
  #   原硬编码会**静默忽略**文档承诺的 REQUIRE_HTTPS 环境变量——一旦激活 prod profile，
  #   即便运维按 README「方式二」在明文栈中显式置 REQUIRE_HTTPS=false 也无效，/api/** 仍被
  #   302 到不存在的 443，全站 API 不可用且无法经文档开关自救。改为占位符后：
  #     · 未设 REQUIRE_HTTPS → 默认 true（保持安全默认）；
  #     · 明文受信内网部署可显式 REQUIRE_HTTPS=false 自救（同时须 COOKIE_SECURE=false）。
  cookie:
    secure: ${COOKIE_SECURE:true}
  security:
    require-https: ${REQUIRE_HTTPS:true}
    # 登录失败节流 / 限流键的可信 IP 来源开关：
    # 生产固定置于可信 nginx 之后（见 frontend/nginx.conf，X-Real-IP / X-Forwarded-For 均以 $remote_addr 覆写），
    # 故开启以取反代覆写的 X-Real-IP；若应用被直连暴露（无受信反代），必须置 false，否则 X-Real-IP 可被客户端伪造。
    trust-proxy-header: ${TRUST_PROXY_HEADER:true}
    csrf:
      enabled: true

# ===================== Flyway：演示种子不进生产库 =====================
# 【存在理由（2026-10-06，落地 DR-18 路径①）】V5 富种子与 V6 示范课 4007 是**演示语料**：
#   含 162 个号段演示账号（ts01..ts12 / st001..st150）与示范课的选课/题库/图谱全量数据。
#   拆分前 base 只有 locations=classpath:db/migration 且 prod 无覆盖 → 全新生产库首启即自动写入这批数据。
# 现在按目录切分（见 application.yaml 注释）：本 profile 只保留结构迁移 V1..V4，整目录排除
#   classpath:db/seed-demo。jar 直跑与 docker-compose 两条部署路径同姿态（compose 已设 SPRING_PROFILES_ACTIVE: prod）。
# 注：V1 内置的 8 个演示账号无法经此排除（V1 已 baseline、脚本校验和不可改），
#   由 DemoAccountHardeningInitializer 按「口令等于种子哈希」停用并改密兜住（本文件 app.demo-accounts.enabled=false）。
#
# ⚠ 隔离只对「全新库」构成机械保证；对灌过 V5/V6 的旧库**不阻断**（2026-10-06 本机 MySQL 8.4 + Flyway 11.7.2 实跑取证）：
#   Flyway 默认 ignoreMigrationPatterns=[*:future]，「历史里有、类路径上找不到」的迁移被判 FUTURE_SUCCESS 而忽略，
#   validate 仍成功、migrate 只打一条 "has a version (6) that is newer than the latest available migration (4)" 的 WARN
#   后执行 0 个迁移 —— 演示账号与示范课数据会原样留在"生产库"里，无人拦截。
#   因此这属于**部署流程约束**：生产库必须是全新库（或历史只到 V1..V4），并按手册 §29 核对
#   flyway_schema_history 最高版本为 4、users 只剩 V1 内置 8 个账号。
#   确需把灌过演示数据的库转生产：先按号段清理演示数据，并删除 flyway_schema_history 中 version 5/6 两行
#   （V5/V6 生成时即做号段隔离，可批量清理）。
#   若确要把这种旧库 fail-fast，可显式置 spring.flyway.ignore-migration-patterns: [] 去掉默认的 *:future，
#   代价是将来正常的前向迁移也会被当 future 阻断 —— 故不作默认。
#   （旧写法 spring.flyway.ignore-missing-migrations 在 Flyway 9 已移除，Boot 元数据标为 error 级废弃。）
spring:
  flyway:
    locations: classpath:db/migration

# ===================== CORS 白名单：生产显式清空 base 的 localhost 白名单 =====================
# 【存在理由（2026-09-16）】base application.yaml 硬编码了 9 条 localhost 白名单且无任何 profile 覆盖，
# 使 SecurityConfig#corsConfigurationSource() 的 `allowedOrigins == null || isEmpty()` 分支**永不成立** ——
# 结果上面 app.cors.dev-fallback=false 沦为**空操作**：「jar 直跑 + prod profile」仍会放行
# http://localhost:5173（且带 allowCredentials(true)）。此处显式清空，使 fail-closed 分支真实可达。
#
# ❗绑定说明（已实测核对，勿想当然）：CorsProperties 是 @ConfigurationProperties(prefix = "cors")
#   —— **不含 app. 前缀**。因此本块必须写在**顶层 cors:**。写进上面的 `app.cors:` 不会生效
#   （实测：写成 app.cors.allowed-origins=[] 后仍绑定出 9 条 base 白名单）。
# ❗优先级说明：环境变量 > 本文件 > base。故 docker-compose 注入的 CORS_ALLOWED_ORIGINS 仍会正常生效
#   （实测：本块置空 + CORS_ALLOWED_ORIGINS=https://app.example.com → 绑定得 [https://app.example.com]）；
#   只有**未注入**该环境变量时才落到本空值 → 走 fail-closed 拒绝一切跨域。
cors:
  allowed-origins: []
