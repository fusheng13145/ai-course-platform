# ===================== AI智能课程平台后端 - 全局配置 =====================
spring:
  # 应用名称
  application:
    name: ai-course-platform

  # ===================== 文件式密钥注入（生产 Secret Manager 接入点） =====================
  # 统一从「密钥目录」读取敏感配置：目录内每个文件名即属性名，文件内容即属性值。
  #   例：/run/secrets/SPRING_DATASOURCE_PASSWORD  →  提供 ${SPRING_DATASOURCE_PASSWORD}
  # 该目录是 Docker Compose `secrets:`、K8s Secret 卷、Vault Agent 渲染输出的共同落点，
  # 因此应用侧无需引入 Spring Cloud 即可被 Vault/Secret Manager 覆盖（见 docs/部署文档.md 的文件式密钥章节）。
  # optional: 前缀保证「目录不存在」时静默跳过——本地 Windows 开发无 /run/secrets 属预期，不影响启动。
  # 【优先级铁律】环境变量 > 本 import 的文件。生产中若改用文件式密钥，必须同时移除同名明文 env，
  # 否则明文 env 会静默覆盖文件值（安全意图被绕过而不报错）。
  # 自定义目录：经环境变量 SPRING_CONFIG_IMPORT=optional:configtree:/your/dir/ 追加，无需改本文件。
  config:
    import:
      - optional:configtree:/run/secrets/

  # ===================== springdoc-openapi（Swagger UI 已于 2026-08-27 恢复） =====================
  # 历史问题：Spring Boot 3.4.4（Spring Framework 6.2.4）的 PathPatternParser 无法解析
  # springdoc 注册的 /swagger-ui/**/*swagger-initializer.js 资源模式（spring-framework#34986，
  # ≤6.2.7 均受影响），曾被迫排除 Swagger UI 自动配置。
  # 修复：升级 Spring Boot 3.4.13（内置 SF 6.2.8+，官方已修复该解析缺陷），
  # 排除项已移除，/api/swagger-ui.html 恢复可用；配套回归测试见 SwaggerUiPatternTest。

  # ===================== 热部署配置 =====================
  devtools:
    restart:
      enabled: false      # 生产环境禁用热部署（local profile 单独覆盖启用）
      additional-paths: src/main/java  # 监听目录
    livereload:
      enabled: true       # 开启页面的热重载（浏览器刷新）

  # ===================== 邮件配置（QQ邮箱） =====================
  # 与下方顶层 mail.* 共用同一组 MAIL_* 环境变量：业务发信读 mail.*，而 Spring Boot 的
  # mail 健康指示器读 spring.mail.*，两处必须同源，否则健康项与实际通道各说一套。
  # 465 端口：MAIL_SSL_ENABLE=true 且 MAIL_STARTTLS_ENABLE=false；
  # 587 端口：MAIL_SSL_ENABLE=false 且 MAIL_STARTTLS_ENABLE=true。
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
          ssl:
            enable: ${MAIL_SSL_ENABLE:false}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:true}
            required: false

  # 数据库数据源 & Hikari连接池
  # 生产环境通过环境变量注入，避免明文密码进入仓库（与 docker-compose 中的变量名保持一致）
  # 【安全说明】生产环境必须使用 useSSL=true，以下默认 false 仅用于本地开发
  datasource:
    # 【安全】生产环境 useSSL=true，requireSSL=true 强制加密传输。
    # 本地开发(HTTP)可在 application-local.yaml 中覆盖为 useSSL=false&requireSSL=false。
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ai_course_platform?useSSL=true&requireSSL=true&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&useUnicode=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SPRING_DATASOURCE_USERNAME:aicourse_app}
    # 生产必须通过环境变量 SPRING_DATASOURCE_PASSWORD 注入（无默认值，避免弱口令进入仓库）
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      # 连接池大小：生产环境建议通过 SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE 调优。
      # 2026-11-10 压测归因（V7 批）：默认 10 在并发 60+ 时成为读路径吞吐封顶瓶颈——
      # 10133 请求中 5383 条 UserMapper.selectById 慢日志（PK 查询 >500ms）实为等连接排队，
      # 修复后读路径吞吐从 63 req/s 封顶显著抬升（对照读数见 测试文档 §4 / 演练记录）。
      # 20 = c100 压测下排队消除的经验值；MySQL max_connections(默认151) 内余量充足。
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:20}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:10}
      connection-timeout: 30000

  # 数据库迁移（Flyway）：替代 index.sql 手动全量导入
  # - 空库：V1__init_schema.sql 自动建表 + 种子数据
  # - 已有库（曾手动导入 index.sql）：baseline-on-migrate 将非空库标为 baseline v1，
  #   V1 不再重复执行（避免 DROP 重建破坏数据）；后续版本 +/… 正常增量
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    # locations 按「结构迁移 / 演示种子」分目录，使生产能整目录排除演示数据（DR-18 路径①）：
    #   db/migration = V1..V4 + V8..V11，建表与结构规范化，生产必需（V5..V7 编号已被演示种子占用，不可回收）；
    #   db/seed-demo = V5 富种子 + V6 计算机网络示范课（含 162 个号段演示账号），仅演示/开发语料。
    # 生产由 application-prod.yml 覆盖为 classpath:db/migration。开发/演示保持双 location，行为与拆分前一致。
    # 注：V5/V6 仅换目录、文件名逐字未改，故 Flyway 的 version/description/校验和不变，
    #     已应用过它们的开发库不会因本次拆分而 validate 失败。
    locations: classpath:db/migration,classpath:db/seed-demo
    # 迁移脚本中的注释含中文，需按 UTF-8 读取
    encoding: UTF-8

  # Redis 配置【必选基础设施】：缓存 / IP 限流 / AI 配额 / 验证码 / 调度锁均依赖 Redis。
  # 应用启动时由 RedisStartupValidator 强校验连通性，连接失败将中止启动（fail-fast）。
  # host/port 可由环境变量 SPRING_DATA_REDIS_HOST / SPRING_DATA_REDIS_PORT 覆盖，便于 Docker 编排。
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      database: 0
      timeout: 3000

  # 缓存实现显式声明为 Redis（避免类路径变化时静默退化为 simple 内存缓存）
  cache:
    type: redis

  # ============ 数据库初始化脚本（安全加固：显式禁用，阻断误触地雷） ============
  # ⚠⚠ 危险配置警告：index.sql 含 DROP TABLE + 全量重建 + 种子数据。
  # 此前 mode: always 且未指定 schema-locations，一旦有人误加 schema-locations，
  # 应用启动即清空整个数据库，不可恢复！
  # 本配置显式 mode: never 强制禁用：即使有人添加 schema-locations 也不会执行。
  # 仅测试 profile（application-contract-test.yml 等）为隔离测试库单独开启初始化。
  # 生产/开发环境初始化请改用显式的数据库迁移工具（Flyway/Liquibase）或手动执行 SQL。
  sql:
    init:
      mode: never
      continue-on-error: true

  # Jackson 全局序列化：时区、日期格式、空值处理
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null

  # 文件上传大小限制
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# ===================== 邮件发送通道（EmailServiceImpl 读取本块） =====================
# 注意：这里与上方 spring.mail 是两套键。EmailServiceImpl 自建 Jakarta Mail
# Session（未使用 Spring 的 JavaMailSender），因此必须单独绑定 mail.*；
# 历史上只配了 spring.mail.*，导致账号永远为空、验证码只入库不发送。
mail:
  host: ${MAIL_HOST:smtp.qq.com}
  port: ${MAIL_PORT:587}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  from-name: ${MAIL_FROM_NAME:AI智能课程平台}
  # 587 端口走 STARTTLS（ssl=false）；465 端口置 ssl=true 且 starttls=false，二者互斥
  ssl-enable: ${MAIL_SSL_ENABLE:false}
  starttls-enable: ${MAIL_STARTTLS_ENABLE:true}
  # 开发态：SMTP 未配置时把验证码打到后端日志（与真实发送同一套服务端校验逻辑）；
  # 生产 profile 覆盖为 false，缺凭据即失败，不静默冒充已发送
  dev-log-code: ${MAIL_DEV_LOG_CODE:true}

# 服务端口 & 统一接口前缀
server:
  port: 8080
  servlet:
    context-path: /api
  # 安全收窄（2026-09-16 修复 P0-2）：不再使用 framework 策略——其会以 X-Forwarded-For 最左端
  # 覆写 getRemoteAddr()，污染审计 IP 且与 HTTPS 检测耦合。改为仅由 TrustedForwardedProtoFilter
  # 映射受信反代回传的 X-Forwarded-Proto（仅设置 scheme/secure，不动 remoteAddr）；客户端 IP 仍由
  # TrustedClientIpResolver 从 X-Real-IP 取值。
  forward-headers-strategy: none
  # Gzip 压缩：减少 JSON 响应体大小 50-80%
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript
    min-response-size: 1024
  # Tomcat 线程池配置（根据 AI LLM 调用长连接场景调优）
  tomcat:
    threads:
      # 最大工作线程数：考虑 AI 调用可达 60s 读取超时，提升至 500 避免线程耗尽
      max: ${TOMCAT_THREADS_MAX:500}
      # 最小空闲线程数
      min-spare: ${TOMCAT_THREADS_MIN_SPARE:20}
    # 连接超时：与 AI_READ_TIMEOUT(60s) 对齐
    connection-timeout: ${TOMCAT_CONNECTION_TIMEOUT:60000}
    # 最大连接数
    max-connections: ${TOMCAT_MAX_CONNECTIONS:10000}
    # 等待队列容量
    accept-count: ${TOMCAT_ACCEPT_COUNT:100}

# ===================== MyBatis-Plus 配置 =====================
mybatis-plus:
  # Mapper XML文件路径
  mapper-locations: classpath*:mapper/**/*.xml
  # 实体类别名包
  type-aliases-package: com.aicourse.entity
  configuration:
    # 下划线转驼峰
    map-underscore-to-camel-case: true
    # SQL 日志实现：默认走 slf4j 并受日志级别约束（生产 INFO 下不打印 SQL），
    # 需要排查时可经环境变量 SQL_LOG_IMPL=org.apache.ibatis.logging.stdout.StdOutImpl 临时开启
    log-impl: ${SQL_LOG_IMPL:org.apache.ibatis.logging.slf4j.Slf4jImpl}
  global-config:
    db-config:
      id-type: auto
      # 逻辑删除配置
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ===================== JWT 认证配置 =====================
jwt:
  # 【重要】生产环境必须配置JWT_SECRET环境变量
  # 开发环境使用默认密钥（仅用于本地开发，生产必须替换）
  # 生产必须通过环境变量 JWT_SECRET 注入（无默认值，避免仓库泄露可用密钥）
  secret: ${JWT_SECRET}
  # Token 有效期：7天(毫秒)
  expiration: 604800000
  # 会话缓存有效期：1天(毫秒)
  session-expiration: 86400000

# ===================== HttpOnly Cookie 认证 & 传输安全配置 =====================
# 【安全默认值】默认按生产姿态：Cookie Secure 开、强制 HTTPS 通道。
# 本地 HTTP 联调请激活 local profile（start.bat 的 all/backend 模式已默认激活），
# 由 application-local.yaml 显式关闭这两项——即「默认安全，开发显式放宽」，
# 杜绝「忘记在生产打开 Secure」这类靠人肉运维的乐观假设。
app:
  # 服务间内部认证（2026-11-07 验收整改批）：非空时 Java→Python（KG 8001 / RAG 8002 / 微调 8003）
  # 全部请求附带 X-Internal-Key 头，Python 端以同名环境变量 INTERNAL_API_KEY 校验（两端必须一致）。
  # 为空（默认）时不发送也不校验——本机裸跑 / 既有单测保持直连。生产 compose 建议必配。
  internal:
    service-api-key: ${INTERNAL_API_KEY:}
  # Redis 必选开关：true 时启动强校验 Redis 连通性（RedisStartupValidator），失败即中止启动。
  # 仅单元测试（无 Redis 环境）允许置 false；生产/开发环境保持 true。
  redis:
    required: ${REDIS_REQUIRED:true}
    startup-check:
      max-retries: ${REDIS_STARTUP_MAX_RETRIES:10}
      retry-interval-ms: ${REDIS_STARTUP_RETRY_INTERVAL_MS:3000}
  cookie:
    # 是否对认证 Cookie 标记 Secure（仅经 HTTPS 传输）。默认 true（安全优先）。
    # 令牌 Cookie 若无 Secure，可经明文 HTTP 通道被中间人窃取。
    secure: ${COOKIE_SECURE:true}
  security:
    # 是否在 Spring Security 层强制 HTTPS 通道（http 请求 302 跳转 https）。默认 true。
    # 生产应始终为 true；本地 HTTP 联调由 local profile 关闭。
    require-https: ${REQUIRE_HTTPS:true}
    # 安全决策用的客户端 IP 来源开关（登录失败节流键 + RateLimitFilter 限流键**共用**这一个）。
    #   false（默认，直连 / 本地开发）：忽略一切代理头，以 TCP 对端地址为准。
    #   true （生产，置于本仓 frontend/nginx.conf 之后）：取反代以 $remote_addr **覆写**的 X-Real-IP。
    # ⚠ 无受信反代时置 true 等于把限流键的 IP 维度交还客户端（伪造 X-Real-IP 即可逐请求换键绕过），
    #   故 prod profile 默认 true、base 默认 false；改代理配置前先读 TrustedClientIpResolver 类注释。
    # ⚠ 本键刻意**只有这一个名字**：DR-66 收口前限流另有一个无 yml 落点的
    #   {@code ratelimit.trust-proxy-header}（只认 XFF 最左段），与节流口径分叉，已删除。
    trust-proxy-header: ${TRUST_PROXY_HEADER:false}
    csrf:
      # 双提交 Cookie CSRF 防护开关。默认 true（纵深防御，与 SameSite=Lax 正交叠加）。
      # 前端 axios 同源自动读取 XSRF-TOKEN Cookie 并回填 X-XSRF-TOKEN 头，无需业务代码改动。
      enabled: ${CSRF_ENABLED:true}
  # ===================== 演示（种子）账号加固 =====================
  # V1 迁移（= index.sql）内置 8 个演示账号（admin/teacher/teacher2/student/student2..5），
  # 共用一枚 BCrypt 弱口令哈希（明文 "123456"）。Flyway V1 已 baseline，脚本不可改，
  # 故由 DemoAccountHardeningInitializer 在运行期收口。
  #   true （默认）：保留演示账号，本地开发/测试/演示不受影响；若仍检测到种子弱口令则启动打 WARN。
  #   false（生产必设）：启动时把「仍为种子弱口令」的演示账号停用(is_active=0)并重置为不可知随机口令；
  #                      已由管理员改密的账号一律不覆盖，加固幂等可重复启动。
  # 铁律：true 与 prod profile 同时出现将 fail-fast 拒绝启动，杜绝「忘记关开关」把弱口令带上生产。
  demo-accounts:
    enabled: ${DEMO_ACCOUNTS_ENABLED:true}

# 跨域允许域名白名单
cors:
  allowed-origins:
    - http://localhost:5173
    - http://localhost:5174
    - http://localhost:5175
    - http://127.0.0.1:5173
    - http://127.0.0.1:5174
    - http://127.0.0.1:5175
    # 以下为 Docker 编排下 nginx(80) 提供前端时的同源来源，确保容器内前端可访问 /api
    - http://localhost
    - http://localhost:80
    - http://127.0.0.1:80

# ===================== AI 大模型供应商配置 =====================
# 通过 ai.provider 切换底层大模型（deepseek / openai / qwen / ollama），业务层不感知具体供应商
ai:
  # 当前启用的供应商：deepseek（默认）/ openai / qwen / ollama（本地 Ollama 服务）
  provider: ${AI_PROVIDER:deepseek}
  # 所有 OpenAI 兼容供应商共用的超时与重试参数（秒）
  connect-timeout: ${AI_CONNECT_TIMEOUT:5}
  read-timeout: ${AI_READ_TIMEOUT:60}
  max-retries: ${AI_MAX_RETRIES:2}
  deepseek:
    # 优先读取系统环境变量 DEEPSEEK_API_KEY，未配置则为空
    api-key: ${DEEPSEEK_API_KEY:}
    # 端点与模型都可被环境变量覆盖（DR-84）：默认值就是原写死值，不填行为零变化。
    # 填这里即可接入任意 OpenAI 兼容网关（如自建 one-api / 硅基流动 / 火山方舟），
    # 否则非 DeepSeek 域名的 Key 只能打到 api.deepseek.com 并必然 401，现象与"密钥无效"同形。
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model: ${OPENAI_MODEL:gpt-4o-mini}
  qwen:
    api-key: ${QWEN_API_KEY:}
    base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    model: ${QWEN_MODEL:qwen-plus}
  # ---------- 本地 Ollama（无 API Key，原生 /api/chat 协议） ----------
  # 启用方式：AI_PROVIDER=ollama，并确保本机已 `ollama serve` 且已 `ollama pull deepseek-r1:8b`。
  # 未启用时对现有 DeepSeek/OpenAI/Qwen 链路零影响；Ollama 未启动时调用以 503 结束并给出可操作文案。
  ollama:
    # Ollama 默认监听 11434；容器化部署需改为 http://host.docker.internal:11434 或宿主可达地址
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:deepseek-r1:8b}
    # 三态开关：留空=由模型模板决定是否思考；true/false=显式要求 Ollama 开启/关闭思考。
    # 无论取值如何，message.thinking / <think> 内联推理都不会进入正式答案。
    think: ${OLLAMA_THINK:}
  # ---------- AI 用量配额（按认证 userId，防 LLM 成本型 DoS） ----------
  # 与 ratelimit（按 IP）互补：IP 限流拦同源洪泛，本配额按登录身份拦「代理池轮换 IP 的刷量」。
  # 单用户单日 LLM 成本数学上界：min(daily-request-limit × 单次 prompt 上限, daily-token-budget)。
  # Redis 原子计数（集群一致），Redis 故障时降级本地内存计数——绝不因 Redis 不可用而放弃配额。
  quota:
    # 总开关（关闭后不做任何用户级配额，仅保留 IP 限流）
    enabled: ${AI_QUOTA_ENABLED:true}
    # 单用户每日 AI 调用次数上限
    daily-request-limit: ${AI_QUOTA_DAILY_REQUESTS:100}
    # 单用户每日 AI token 预算（prompt+响应估算值，字符按 1.5:1 折算 token）
    daily-token-budget: ${AI_QUOTA_DAILY_TOKENS:200000}

# ===================== 考试超时收卷策略 =====================
# 背景（2026-09-14 修复）：ExamTimeoutScheduler 原缺时限判定导致「30 秒内强制收卷全部进行中考试」；
# 补齐判定后出现的边界是——若试卷既无 time_limit/duration 也无 end_time，则无期限依据、永不自动收卷。
# 此处提供兜底时长，使「无期限依据」的试卷仍有确定的收卷时点；设 0 可显式关闭兜底（改为人工/管理端收卷）。
exam:
  timeout:
    default-time-limit-minutes: ${EXAM_DEFAULT_TIME_LIMIT_MINUTES:120}

# ===================== 限流配置（IP 级，Redis 集群优先，本地内存兜底） =====================
ratelimit:
  # 总开关
  enabled: ${RATELIMIT_ENABLED:true}
  # Redis 集群限流开关：true 时优先使用 Redis 共享计数（多实例一致）；false 或 Redis 故障时回退本地内存
  redis:
    enabled: ${RATELIMIT_REDIS_ENABLED:true}
  # 登录接口按 IP 限流：默认 60 秒内最多 10 次，缓解暴力破解
  login:
    limit: ${RATELIMIT_LOGIN_LIMIT:10}
    window-seconds: ${RATELIMIT_LOGIN_WINDOW:60}
  # AI 接口按 IP 限流：默认 60 秒内最多 20 次，作为大模型调用成本上限的代理防护
  ai:
    limit: ${RATELIMIT_AI_LIMIT:20}
    window-seconds: ${RATELIMIT_AI_WINDOW:60}
  # 验证码接口按 IP 限流：默认 60 秒内最多 5 次，防止邮件/短信轰炸
  verify-code:
    limit: ${RATELIMIT_VERIFY_LIMIT:5}
    window-seconds: ${RATELIMIT_VERIFY_WINDOW:60}
  # 注册接口按 IP 限流：默认 3600 秒内最多 20 次
  # （安全修复 B1：注册此前可零成本批量自建账号，除「验证码强制」外加一道 IP 维度总量约束）
  register:
    limit: ${RATELIMIT_REGISTER_LIMIT:20}
    window-seconds: ${RATELIMIT_REGISTER_WINDOW:3600}

# ===================== Sentinel 流量控制与熔断降级 =====================
# 与既有 ratelimit（IP 级、按来源防刷）分层协作：Sentinel 负责「资源/容量治理 + 下游熔断」。
# 规则全部配置化（支持环境变量覆盖）；master switch sentinel.enabled=false 可整体降级为透传。
sentinel:
  enabled: ${SENTINEL_ENABLED:true}
  # 规则持久化目录（相对进程工作目录或绝对路径）；启动时将 YAML 规则落盘为 flow-rules.json / degrade-rules.json，并支持运行期热刷新。
  rules-dir: ${SENTINEL_RULES_DIR:sentinel-rules}
  web:
    # URL 级流控过滤器开关
    enabled: ${SENTINEL_WEB_ENABLED:true}
    # 全局入口限流（QPS）。默认 0=不启用（避免误伤开发/压测）；生产可按容量设为如 2000。
    global-qps: ${SENTINEL_WEB_GLOBAL_QPS:0}
    # 排除路径前缀（探活 / WebSocket / Swagger 不被限流）
    exclude-paths:
      - /api/actuator
      - /actuator
      - /api/ws
      - /ws
      - /swagger-ui
      - /v3/api-docs
      - /api-docs
      - /api-docs.html
  # 流控规则（按资源名 METHOD:path 或 @SentinelResource 指定值精确匹配）
  flow-rules:
    # 示例：AI 问答入口按 QPS 限流，保护昂贵的 LLM / RAG 下游调用
    - resource: "POST:/api/ai/qa/ask"
      grade: 1                      # 1=QPS，0=并发线程数
      count: ${SENTINEL_FLOW_AI_QA_QPS:50}
      limit-app: default
      strategy: 0
      control-behavior: 0
      max-queueing-time-ms: 500
    # 对 Python RAG 微服务（8002）下游调用做方法级 QPS 限制，防止打爆检索服务
    - resource: "rag:http"
      grade: 1
      count: ${SENTINEL_FLOW_RAG_QPS:50}
      limit-app: default
      strategy: 0
      control-behavior: 0
      max-queueing-time-ms: 500
  # 熔断降级规则（按资源名精确匹配）
  degrade-rules:
    # 对 RAG 下游：慢调用比例策略 —— 10s 窗口内慢调用(>3000ms)占比 >50% 且请求数≥5 时熔断 10s
    - resource: "rag:http"
      grade: 0                      # 0=慢调用比例，1=异常比例，2=异常数
      count: 3000                   # 慢调用阈值(ms)
      time-window: 10               # 熔断时长(s)
      min-request-amount: 5
      stat-interval-ms: 10000
      slow-ratio-threshold: 0.5

# ===================== Python 知识图谱服务配置 =====================
# 注意（2026-08-13 职责边界）：知识图谱引擎（图谱构建、多跳推理、GraphRAG）
# 由团队另一成员负责；本端不再内置引擎实现，仅保留知识点的消费侧 CRUD、
# 掌握度/关联查询与 /extract 摄取端点，并通过 HTTP 代理对接 Python 知识图谱服务。
# 以下配置为未来可能接入独立 Python 知识图谱微服务的预留占位，默认关闭。
knowledge-graph:
  # 是否启用 Python 知识图谱服务（当前 Java 端仅保留消费侧与 HTTP 代理，默认关闭）
  enabled: ${KG_ENABLED:false}
  # Python知识图谱服务地址（独立端口，与RAG服务隔离）
  base-url: ${KG_BASE_URL:http://localhost:8001}
  # HTTP 连接超时（秒）
  connect-timeout: ${KG_CONNECT_TIMEOUT:5}
  # HTTP 读取超时（秒）
  read-timeout: ${KG_READ_TIMEOUT:30}
  # 重试次数
  max-retries: ${KG_MAX_RETRIES:2}
  # 健康检查路径
  health-path: ${KG_HEALTH_PATH:/api/v1/graph/health}
  # ---------- GraphRAG 参数 ----------
  rag:
    # 子图 BFS 扩图最大跳数（1=直接邻居, 2=邻居的邻居）；仅用于 subgraph，
    # 与学习路径规划无关——路径规划请求未指定跳数时返回两点间真实最短路径
    max-hops: ${KG_RAG_MAX_HOPS:2}

# ===================== Python RAG 服务配置 =====================
# 注意（职责边界）：RAG 检索引擎（BM25 / 向量检索 / embedding / 融合）由团队另一成员负责，
# 本端不再内置引擎实现，仅保留 RAGService 标准化接口 + 本 HTTP 代理；rag.enabled=true 时调用 Python 端
# /api/v1/rag/* 契约（权威单一事实来源见 docs/系统架构设计.md 的集成契约章节），未启用或不可达时降级返回 {"code":503}（AI 问答自动回退纯 LLM）。
rag:
  # 是否启用 Python RAG 服务（默认关闭）
  enabled: ${RAG_ENABLED:false}
  # Python RAG服务地址（独立端口，与知识图谱服务隔离）
  base-url: ${RAG_BASE_URL:http://localhost:8002}
  # HTTP 连接超时（秒）
  connect-timeout: ${RAG_CONNECT_TIMEOUT:5}
  # HTTP 读取超时（秒）
  read-timeout: ${RAG_READ_TIMEOUT:60}
  # 重试次数
  max-retries: ${RAG_MAX_RETRIES:2}
  # 默认检索返回数量
  default-top-k: ${RAG_DEFAULT_TOP_K:5}
  # 健康检查路径
  health-path: ${RAG_HEALTH_PATH:/api/v1/rag/health}
  # （引擎参数——bm25.k1/b、embedding、retriever.mode、vector.index、hybrid 权重——已随引擎实现剥离移除：
  #   RAG 检索引擎由团队另一成员负责，本端仅保留 RAGService 接口与上述 HTTP 代理配置）

# ===================== Python LoRA/微调 服务配置 =====================
fine-tune:
  # 是否启用微调服务
  enabled: ${FT_ENABLED:false}
  # Python微调服务地址
  base-url: ${FT_BASE_URL:http://localhost:8003}
  # HTTP 连接超时（秒）
  connect-timeout: ${FT_CONNECT_TIMEOUT:5}
  # HTTP 读取超时（秒，微调任务可能较长）
  read-timeout: ${FT_READ_TIMEOUT:300}
  # 重试次数
  max-retries: ${FT_MAX_RETRIES:1}
  # 健康检查路径
  health-path: ${FT_HEALTH_PATH:/api/v1/fine-tune/health}

# 本地文件上传路径与大小
file:
  upload-dir: uploads/
  # 分片上传的临时落盘目录（相对进程工作目录，与 upload-dir 同级）。
  # 刻意置于 upload-dir 之外：未合并完的分片不得出现在 /uploads/** 静态映射里。
  # 会话取消/过期与合并成功后由 FileUploadSessionServiceImpl 回收该目录。
  chunk-dir: ${FILE_CHUNK_DIR:upload-chunks/}
  max-size: 52428800

# ===================== MinIO 对象存储配置（默认禁用） =====================
# 启用后将使用 MinIO 替代本地磁盘作为文件存储后端。
# 设置 minio.enabled=true 并提供正确的 endpoint/access-key/secret-key 即可激活。
# 注意：启用前请确保 MinIO 服务已启动且网络可达。
minio:
  enabled: false
  endpoint: http://localhost:9000
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  bucket: aicourse-uploads

# ===================== 可观测性 / Actuator 配置 =====================
# 暴露端点：health 默认公开（供 Docker/K8s 探针与负载均衡探活），
# info/metrics/prometheus 供运维监控；prometheus 在 SecurityConfig 中限定 ADMIN。
management:
  metrics:
    distribution:
      # 启用 HTTP 请求直方图，暴露 _bucket 指标，支撑 P99 延迟告警（默认仅 count/sum）
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        # 仅暴露必要端点，遵循最小暴露原则
        include: health,info,metrics,prometheus
      # Actuator 基础路径（结合 server.servlet.context-path=/api，实际为 /api/actuator）
      base-path: /actuator
  endpoint:
    health:
      # 未授权请求仅返回 status（不泄露 DB/Redis 等内部详情）
      show-details: when_authorized
      # 探针（Kubernetes 等）使用 readiness/liveness 子端点
      probes:
        enabled: true
      group:
        # 编排探活专用组：只计入「决定实例能否服务流量」的探针（就绪态 + DB + Redis + 磁盘），
        # **不含 llmProvider**：缺 DEEPSEEK_API_KEY 时 AI 能力按契约降级为抽取式回答，业务链路不受影响
        # （手册 §40）。把它算进来会让综合状态恒 DOWN → 组合编排的 backend 探针永不过、
        # frontend 的 depends_on: service_healthy 卡死，未配 Key 的环境整栈拉不起来
        # （2026-10-07 CMP-1 真机首启实测，见附录 D.12.3）。
        probe:
          include: readinessState,database,redis,diskSpace
    prometheus:
      enabled: true
  health:
    # 关闭 Spring 默认 db / redis 兜底健康检查，改由自定义 HealthIndicator 显式实现
    db:
      enabled: false
    redis:
      enabled: false
    # 保留磁盘空间健康检查（默认开启）
    diskspace:
      enabled: true

# ===================== 应用元信息（info 端点展示） =====================
# 直接读取 Maven 构建属性（spring-boot-starter-parent 已开启 @ 占位符过滤），
# 保证版本与构建产物一致，无需手写；占位符不会被 ${...} 环境变量机制干扰。
info:
  app:
    name: @project.name@
    version: @project.version@

# 日志级别
# 生产默认 INFO，避免 DEBUG 泄露内部细节与拖慢性能；
# 排查时可经环境变量 LOG_LEVEL_COM_AICOURSE=DEBUG 提级（配合 Spring 的
# logging.level.com.aicourse 覆盖机制），无需改动代码与镜像。
logging:
  level:
    com.aicourse: ${LOG_LEVEL_COM_AICOURSE:INFO}