<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Content Security Policy（前端兜底层）：与后端 SecurityConfig 策略一致。
         当应用不经过 Spring 后端直接由 Nginx/CDN 分发时，后端 CSP 头不可用，
         此 meta 标签作为第二道防线。后端 CSP 响应头优先级高于 meta 标签。
         注意：frame-ancestors 仅在 HTTP 响应头中生效，meta 标签内设置会被浏览器忽略，
         因此此处未包含该指令；防 iframe 嵌入由后端 X-Frame-Options/DENY 负责。 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'"
    />
    <title>AI智能课程平台</title>
  </head>
  <body>
    <!-- 全局请求加载进度条 -->
    <div
      id="global-loading-bar"
      style="
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 9999;
        height: 3px;
        width: 0%;
        background: linear-gradient(90deg, #409eff, #67c23a);
        border-radius: 0 2px 2px 0;
        pointer-events: none;
      "
    ></div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
