# =============================================================================
# ⚠️ 本配置仅提供 **80 端口明文 HTTP**，且 docker-compose 未挂载任何证书卷。
#    · 仅可用于本机 / 受信内网评估；**禁止直接暴露公网**（令牌与口令将明文传输）。
#    · 生产必须二选一，否则后端 REQUIRE_HTTPS=true 时 /api/** 会被 302 到不存在的 443：
#        ① 在本容器之前再加一层 TLS 终止反代，并由该反代回传 `X-Forwarded-Proto: https`；
#        ② 为本 server 增加 `listen 443 ssl` + 证书挂载，并同步修改 docker-compose 端口映射。
#    · 注意：下方 `X-Forwarded-Proto $scheme` 在只有 80 监听时**恒为 http**，
#      仅靠它无法让后端识别为安全通道 —— 这正是需要外部 TLS 终止的原因。
#    · 对应文档：README「方式二：Docker 容器化部署」路径①（HTTP 明文评估）/ 路径②（生产）。
#
# 【DR-34 非 root 化】2026-10-08：监听端口 80 → 8080。容器内 nginx 以 uid=101 运行，
#    Linux 上 <1024 的端口只有 root 能绑，故进程端口必须上移到 8080；
#    docker-compose.yml 的**宿主机侧**端口不变（默认仍 80），映射形如 `127.0.0.1:80:8080`，
#    因此浏览器、CORS 白名单与 E2E 用例访问的 URL 全部保持原样，本改动对外无感。
# =============================================================================
server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 修复 P1-23：默认 1MB 会阻断所有 >1MB 上传（后端允许 50MB），与后端 multipart 限制对齐
    client_max_body_size 50m;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # 前端静态资源（SPA 路由回退：刷新子路由时不 404）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到后端（后端 context-path 为 /api）
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 安全：必须用覆写而非追加。应用侧限流/节流以 X-Forwarded-For（或 Spring 由它推导的
        # remoteAddr）作为安全决策依据；$proxy_add_x_forwarded_for 会把客户端自带的 XFF 拼到最左端，
        # 而 Spring 的 forward-headers-strategy=framework 取最左端 → 攻击者可逐请求换头绕过限流。
        # 详见 TrustedClientIpResolver 的类注释。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;

        # SSE 流式传输支持：禁用缓冲，实时传递数据
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # WebSocket 实时通道（后端 /ws，经 context-path 对外为 /api/ws；前端 utils/websocket.ts 连接之）。
    # 必须单列一个 location：WebSocket 握手要完成 HTTP/1.1 协议升级，而上面通用的 /api/ 块
    # 没有 Upgrade/Connection 头，Spring 收不到升级请求 → 返回 400，握手必然失败；
    # 其 proxy_read_timeout 60s 也会掐断空闲长连接（心跳间隔 30s，留足余量后仍会误杀）。
    # 前缀匹配按「最长」命中，/api/ws 比 /api/ 更长，故本块优先于通用 API 块。
    location /api/ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 与 /api/ 同源的安全口径：覆写而非追加，防止伪造 XFF 绕过按 IP 的限流。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 长连接：连接建立后由前端 30s 心跳保活，这里放宽读写超时避免主动掐断。
        proxy_connect_timeout 30s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 文件下载：后端统一经 /api/resources/download/{id} 提供。
    # 若前端直接引用 /uploads/ 静态地址，转发至后端并补齐 /api context-path。
    location /uploads/ {
        proxy_pass http://backend:8080/api/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 安全：必须用覆写而非追加。应用侧限流/节流以 X-Forwarded-For（或 Spring 由它推导的
        # remoteAddr）作为安全决策依据；$proxy_add_x_forwarded_for 会把客户端自带的 XFF 拼到最左端，
        # 而 Spring 的 forward-headers-strategy=framework 取最左端 → 攻击者可逐请求换头绕过限流。
        # 详见 TrustedClientIpResolver 的类注释。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
